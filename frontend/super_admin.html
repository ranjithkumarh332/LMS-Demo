function arcPath(cx,cy,r,startDeg,endDeg){
  const [x1,y1] = polar(cx,cy,r,startDeg);
  const [x2,y2] = polar(cx,cy,r,endDeg);
  const large = (endDeg-startDeg) > 180 ? 1 : 0;
  return `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`;
}

/* ---- 1. Sparkline Area Chart — filled trend line + end marker ---- */
function ovSparklineAreaSVG(spark,color){
  const padX=16, top=56, bottom=118;
  const min=Math.min(...spark), max=Math.max(...spark)||1, range=(max-min)||1;
  const stepX=(136-2*padX)/(spark.length-1);
  const pts=spark.map((v,i)=>[+(padX+i*stepX).toFixed(1), +(bottom-((v-min)/range)*(bottom-top)).toFixed(1)]);
  const line=pts.map(p=>p.join(',')).join(' ');
  const area=`M${pts[0][0]},${bottom} L${pts.map(p=>p.join(',')).join(' L')} L${pts[pts.length-1][0]},${bottom} Z`;
  const last=pts[pts.length-1];
  const gid='ovSpk'+Math.random().toString(36).slice(2,8);
  let len=0; for(let i=1;i<pts.length;i++) len+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  return `<svg viewBox="0 0 136 136">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.3"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${gid})" class="ov-fade" style="animation-delay:calc(var(--ov-i,0)*55ms + 260ms)"/>
    <polyline class="ov-arc" points="${line}" fill="none" stroke="${color}" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${len.toFixed(1)}" style="--ov-dash:${len.toFixed(1)};--ov-off:0"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="8" fill="${color}" opacity="0.15" class="ov-fade" style="animation-delay:calc(var(--ov-i,0)*55ms + 500ms)"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${color}" class="ov-pop" style="animation-delay:calc(var(--ov-i,0)*55ms + 650ms)"/>
  </svg>`;
}

/* ---- 2. Trend Signal — diagonal trend line + directional chevron ---- */
function ovTrendSignalSVG(trend,color,up){
  const y1 = up?114:22, y2 = up?22:114;
  const mid=(y1+y2)/2;
  const pts=[[18,y1],[46,y1-(y1-mid)*0.7],[72,mid],[98,y2+(mid-y2)*0.7],[118,y2]];
  const line=pts.map(p=>p.join(',')).join(' ');
  let len=0; for(let i=1;i<pts.length;i++) len+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  const chevronY = up? 34 : 102;
  const arrow = up
    ? `M58 ${chevronY+13} L76 ${chevronY-3} L94 ${chevronY+13}`
    : `M58 ${chevronY-13} L76 ${chevronY+3} L94 ${chevronY-13}`;
  return `<svg viewBox="0 0 136 136">
    <path d="${arrow}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.13" class="ov-fade" style="animation-delay:calc(var(--ov-i,0)*55ms + 100ms)"/>
    <polyline class="ov-arc" points="${line}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${len.toFixed(1)}" style="--ov-dash:${len.toFixed(1)};--ov-off:0"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:2.4}" fill="${color}" class="ov-pop" style="animation-delay:calc(var(--ov-i,0)*55ms + ${320+i*90}ms)"/>`).join('')}
  </svg>`;
}

/* ---- 3. Vertical Bar Chart — column series built from spark data ---- */
function ovVerticalBarsSVG(spark,color){
  const n=spark.length, gap=6, padX=14, barW=(136-2*padX-gap*(n-1))/n;
  const max=Math.max(...spark)||1, baseline=120;
  return `<svg viewBox="0 0 136 136">
    <line x1="10" y1="${baseline}" x2="126" y2="${baseline}" stroke="var(--line)" stroke-width="1.5"/>
    ${spark.map((v,i)=>{
      const h=Math.max(6,(v/max)*88);
      const x=padX+i*(barW+gap), y=baseline-h;
      const op = i===n-1?1:0.5;
      return `<rect class="ov-grow-y" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${color}" opacity="${op}" style="animation-delay:calc(var(--ov-i,0)*55ms + ${120+i*70}ms)"/>`;
    }).join('')}
  </svg>`;
}

/* ---- 4. Donut Chart — chunky composition ring ---- */
function ovDonutSVG(pct,color){
  const cx=68,cy=68,r=48,th=23, p=Math.max(0,Math.min(100,pct)), c=2*Math.PI*r, off=c*(1-p/100);
  return `<svg viewBox="0 0 136 136">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${th}" opacity="0.16"/>
    <circle class="ov-arc" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${th}" stroke-dasharray="${c.toFixed(1)}" style="--ov-dash:${c.toFixed(1)};--ov-off:${off.toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>
  </svg>`;
}

/* ---- 5. Semi-Circular Gauge — flat-bottom dome, single fill ---- */
function ovSemiGaugeSVG(pct,color){
  const cx=68,cy=92,r=54,th=12;
  const track = arcPath(cx,cy,r,-90,90);
  const val = arcPath(cx,cy,r,-90,-90+180*(Math.max(0,Math.min(100,pct))/100));
  return `<svg viewBox="0 0 136 136">
    <path d="${track}" fill="none" stroke="var(--line)" stroke-width="${th}" stroke-linecap="round" class="ov-fade" style="animation-delay:calc(var(--ov-i,0)*55ms)"/>
    <path class="ov-pop" d="${val}" fill="none" stroke="${color}" stroke-width="${th}" stroke-linecap="round" style="animation-delay:calc(var(--ov-i,0)*55ms + 220ms)"/>
  </svg>`;
}

/* ---- 6. Polar / Radial Spoke Chart — value-length spokes around center ---- */
function ovPolarSpokesSVG(spark,color){
  const cx=68,cy=68, n=spark.length, maxLen=52, minLen=16;
  const max=Math.max(...spark)||1;
  let out='';
  for(let i=0;i<n;i++){
    const angle = (360/n)*i;
    const len = minLen + (spark[i]/max)*(maxLen-minLen);
    const [x2,y2]=polar(cx,cy,len,angle);
    out += `<line class="ov-arc" x1="${cx}" y1="${cy}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="7" stroke-linecap="round" opacity="${i===n-1?1:0.42}" stroke-dasharray="${len.toFixed(1)}" style="--ov-dash:${len.toFixed(1)};--ov-off:0;animation-delay:calc(var(--ov-i,0)*55ms + ${i*70}ms)"/>`;
  }
  return `<svg viewBox="0 0 136 136">
    <circle cx="${cx}" cy="${cy}" r="${minLen-7}" fill="none" stroke="var(--line)" stroke-width="1.5" opacity="0.6"/>
    ${out}
    <circle cx="${cx}" cy="${cy}" r="4" fill="${color}"/>
  </svg>`;
}

/* ---- 7. Horizontal Progress Bar — labeled linear fill ---- */
function ovHBarSVG(pct,color){
  const p=Math.max(0,Math.min(100,pct));
  const trackW=100, x=18, y=64, h=14;
  const fillW=(trackW*p/100);
  return `<svg viewBox="0 0 136 136">
    <rect x="${x}" y="${y}" width="${trackW}" height="${h}" rx="7" fill="var(--line)" opacity="0.5"/>
    <rect class="ov-grow-x" x="${x}" y="${y}" width="${fillW.toFixed(1)}" height="${h}" rx="7" fill="${color}" style="animation-delay:calc(var(--ov-i,0)*55ms + 150ms)"/>
    <circle cx="${(x+fillW).toFixed(1)}" cy="${y+h/2}" r="3.4" fill="${color}" class="ov-pop" style="animation-delay:calc(var(--ov-i,0)*55ms + 500ms)"/>
  </svg>`;
}

/* ---- 8. Segmented Progress Bar — discrete chunk fill ---- */
function ovSegmentedSVG(pct,color,segments=8){
  const p=Math.max(0,Math.min(100,pct));
  const filled=Math.round((p/100)*segments);
  const x=16, y=64, gap=4, w=(136-2*x-gap*(segments-1))/segments, h=16;
  let out='';
  for(let i=0;i<segments;i++){
    const on = i<filled;
    out += `<rect class="${on?'ov-pop':''}" x="${(x+i*(w+gap)).toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="${h}" rx="3" fill="${on?color:'var(--line)'}" opacity="${on?1:0.5}" style="animation-delay:calc(var(--ov-i,0)*55ms + ${150+i*55}ms)"/>`;
  }
  return `<svg viewBox="0 0 136 136">${out}</svg>`;
}

/* ---- 9. Battery Indicator — capacity meter ---- */
function ovBatterySVG(pct,color){
  const p=Math.max(0,Math.min(100,pct));
  const bx=22,by=52,bw=82,bh=34,capW=6,capH=16;
  const innerW=bw-8, fillW=(innerW*p/100);
  return `<svg viewBox="0 0 136 136">
    <rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="7" fill="none" stroke="var(--line)" stroke-width="3"/>
    <rect x="${bx+bw}" y="${by+(bh-capH)/2}" width="${capW}" height="${capH}" rx="2" fill="var(--line)"/>
    <rect class="ov-grow-x" x="${bx+4}" y="${by+4}" width="${fillW.toFixed(1)}" height="${bh-8}" rx="4" fill="${color}" style="animation-delay:calc(var(--ov-i,0)*55ms + 180ms)"/>
  </svg>`;
}

/* ---- 10. Thermometer Chart — vertical fill with bulb ---- */
function ovThermometerSVG(pct,color){
  const p=Math.max(0,Math.min(100,pct));
  const cx=68, topY=28, bottomY=98, bulbR=14, tubeW=16;
  const fillH=(bottomY-topY)*(p/100);
  return `<svg viewBox="0 0 136 136">
    <rect x="${cx-tubeW/2}" y="${topY}" width="${tubeW}" height="${bottomY-topY+bulbR}" rx="${tubeW/2}" fill="none" stroke="var(--line)" stroke-width="3"/>
    <rect class="ov-grow-y" x="${cx-tubeW/2+3}" y="${(bottomY-fillH).toFixed(1)}" width="${tubeW-6}" height="${(fillH+bulbR).toFixed(1)}" rx="${(tubeW-6)/2}" fill="${color}" style="animation-delay:calc(var(--ov-i,0)*55ms + 160ms)"/>
    <circle cx="${cx}" cy="${bottomY+bulbR}" r="${bulbR}" fill="${color}"/>
  </svg>`;
}

/* ---- 11. Stream / Wave Area Chart — flowing filled curve ---- */
function ovStreamSVG(spark,color){
  const padX=12, top=40, bottom=112;
  const min=Math.min(...spark), max=Math.max(...spark)||1, range=(max-min)||1;
  const stepX=(136-2*padX)/(spark.length-1);
  const pts=spark.map((v,i)=>[padX+i*stepX, bottom-((v-min)/range)*(bottom-top)]);
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=1;i<pts.length;i++){
    const mx=(pts[i-1][0]+pts[i][0])/2, my=(pts[i-1][1]+pts[i][1])/2;
    d+=` Q${pts[i-1][0].toFixed(1)},${pts[i-1][1].toFixed(1)} ${mx.toFixed(1)},${my.toFixed(1)}`;
  }
  d+=` L${pts[pts.length-1][0].toFixed(1)},${pts[pts.length-1][1].toFixed(1)}`;
  const area=`${d} L${pts[pts.length-1][0].toFixed(1)},${bottom} L${pts[0][0].toFixed(1)},${bottom} Z`;
  const gid='ovStr'+Math.random().toString(36).slice(2,8);
  return `<svg viewBox="0 0 136 136">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.5"/><stop offset="100%" stop-color="${color}" stop-opacity="0.05"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${gid})" class="ov-fade" style="animation-delay:calc(var(--ov-i,0)*55ms + 140ms)"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.25" class="ov-fade" style="animation-delay:calc(var(--ov-i,0)*55ms + 320ms)"/>
  </svg>`;
}

/* ---- 12. Lollipop Chart — stick + circle against a baseline ---- */
function ovLollipopSVG(pct,color){

  const x=(x0+(x1-x0)*p/100);

    <line class="ov-grow-x" x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${color}" stroke-width="3" stroke-linecap="round" opacity="0.3" style="animation-delay:calc(var(--ov-i,0)*55ms + 140ms)"/>
    <line x1="${x.toFixed(1)}" y1="${y}" x2="${x.toFixed(1)}" y2="40" stroke="${color}" stroke-width="2" opacity="0.4"/>
    <circle cx="${x.toFixed(1)}" cy="40" r="9" fill="${color}" class="ov-pop" style="animation-delay:calc(var(--ov-i,0)*55ms + 420ms)"/>

/* ---- 13. Bubble / Scatter Plot — value-sized dots across a mini plot ---- */
function ovBubbleSVG(spark,color){
  const padX=16, top=30, bottom=112;
  const min=Math.min(...spark), max=Math.max(...spark)||1, range=(max-min)||1;
  const n=spark.length, stepX=(136-2*padX)/(n-1);
  return `<svg viewBox="0 0 136 136">
    <line x1="10" y1="${bottom}" x2="126" y2="${bottom}" stroke="var(--line)" stroke-width="1.5"/>
    ${spark.map((v,i)=>{
      const x=padX+i*stepX, t=(v-min)/range, y=bottom-t*(bottom-top), r=5+t*7;
      const isLast = i===n-1;
      return `<circle class="ov-pop" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${color}" opacity="${isLast?0.9:(0.3+t*0.2).toFixed(2)}" style="animation-delay:calc(var(--ov-i,0)*55ms + ${150+i*70}ms)"/>`;
    }).join('')}
  </svg>`;
}

/* ---- 14. Grouped Bar Chart — current vs prior period comparison ---- */
function ovGroupedBarsSVG(spark,color){
  const n=Math.min(spark.length,4);
  const recent = spark.slice(-n);
  const prior = spark.length>n ? spark.slice(-n-1,-1) : recent.map(v=>v*0.85);
  const max = Math.max(...recent,...prior)||1;
  const groupW=(136-28)/n, barW=(groupW-10)/2, baseline=118, top=30;
  let out='';
  for(let i=0;i<n;i++){
    const gx=14+i*groupW;
    const h1=Math.max(4,(prior[i]/max)*(baseline-top));
    const h2=Math.max(4,(recent[i]/max)*(baseline-top));
    out += `<rect class="ov-grow-y" x="${gx.toFixed(1)}" y="${(baseline-h1).toFixed(1)}" width="${barW.toFixed(1)}" height="${h1.toFixed(1)}" rx="2.5" fill="var(--text-faint)" opacity="0.5" style="animation-delay:calc(var(--ov-i,0)*55ms + ${120+i*70}ms)"/>`;
    out += `<rect class="ov-grow-y" x="${(gx+barW+4).toFixed(1)}" y="${(baseline-h2).toFixed(1)}" width="${barW.toFixed(1)}" height="${h2.toFixed(1)}" rx="2.5" fill="${color}" style="animation-delay:calc(var(--ov-i,0)*55ms + ${150+i*70}ms)"/>`;
  }
  return `<svg viewBox="0 0 136 136">
    <line x1="10" y1="${baseline}" x2="126" y2="${baseline}" stroke="var(--line)" stroke-width="1.5"/>
    ${out}
  </svg>`;
}

function miniBarsHTML(data){
  const max = Math.max(...data.map(d=>d.value))||1;
  return data.map(d=>`
    <div class="pp-bar-col">
      <div class="pp-bar-val">${d.value}%</div>
      <div class="pp-bar-shape" style="height:${Math.max(8,(d.value/max)*100)}%;"></div>
      <div class="pp-bar-label">${d.label}</div>
    </div>`).join('');
}

function sparklineSVG(values, color, w=110, h=34){
  const max = Math.max(...values), min = Math.min(...values);
  const range = (max-min)||1;
  const step = w/(values.length-1);
  const pts = values.map((v,i)=>[i*step, h - ((v-min)/range)*(h-4) - 2]);
  const line = pts.map(p=>p.join(',')).join(' ');
  const area = `0,${h} ${line} ${w},${h}`;
  const id = 'sp'+Math.random().toString(36).slice(2,9);
  return `<svg class="kpi-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <polygon points="${area}" fill="url(#${id})"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function donutSVG(segments, size=180, thickness=26){
  const total = segments.reduce((a,s)=>a+s.value,0) || 1;
  const cx=size/2, cy=size/2, r=(size-thickness)/2;
  let angle = 0;
  let paths = '';
  segments.forEach(seg=>{
    const frac = seg.value/total;
    const start = angle;
    const end = angle + frac*360;
    angle = end;
    const large = (end-start) > 180 ? 1 : 0;
    const [x1,y1] = polar(cx,cy,r,start);
    const [x2,y2] = polar(cx,cy,r,end - (frac<1?0.6:0));
    paths += `<path d="M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}" fill="none" stroke="${seg.color}" stroke-width="${thickness}" stroke-linecap="butt"/>`;
  });
  return `<svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:${size}px;display:block;margin:0 auto;">${paths}
    <text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700" fill="var(--text)">${total}</text>
    <text x="${cx}" y="${cy+16}" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="var(--text-faint)">STUDENTS</text>
  </svg>`;
}

function radarSVG(axes, size=280){
  const cx=size/2, cy=size/2, r=size/2-42, n=axes.length;
  let grid = '';
  [20,40,60,80,100].forEach(pct=>{
    const pts = axes.map((_,i)=>polar(cx,cy,r*pct/100, i*360/n).join(',')).join(' ');
    grid += `<polygon points="${pts}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  });
  axes.forEach((ax,i)=>{
    const [x,y] = polar(cx,cy,r,i*360/n);
    grid += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
  });
  const dataPts = axes.map((ax,i)=>polar(cx,cy,r*ax.value/100, i*360/n).join(',')).join(' ');
  let labels = '';
  axes.forEach((ax,i)=>{
    const [x,y] = polar(cx,cy,r+22, i*360/n);
    labels += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-family="Inter, sans-serif" font-size="11" fill="var(--text-soft)">${ax.label}</text>`;
  });
  return `<svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:${size+40}px;display:block;margin:0 auto;">
    ${grid}
    <polygon points="${dataPts}" fill="rgba(31,158,147,0.22)" stroke="var(--teal-dark)" stroke-width="2"/>
    ${axes.map((ax,i)=>{ const [x,y]=polar(cx,cy,r*ax.value/100,i*360/n); return `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--teal-dark)"/>`; }).join('')}
    ${labels}
  </svg>`;
}

function lineChartSVG(series, months, w=560, h=220){
  const padL=30, padR=14, padT=16, padB=28;
  const iw = w-padL-padR, ih = h-padT-padB;
  const stepX = iw/(months.length-1);
  let grid='', axisLabels='';
  [0,25,50,75,100].forEach(v=>{
    const y = padT + ih - (v/100)*ih;
    grid += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    axisLabels += `<text x="4" y="${y+3}" font-family="JetBrains Mono, monospace" font-size="9.5" fill="var(--text-faint)">${v}</text>`;
  });
  months.forEach((m,i)=>{ axisLabels += `<text x="${padL+i*stepX}" y="${h-8}" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="var(--text-faint)">${m}</text>`; });
  let lines = '';
  series.forEach(s=>{
    const pts = s.values.map((v,i)=> v>0 ? [padL+i*stepX, padT+ih-(v/100)*ih] : null);
    const validPts = pts.filter(Boolean);
    const path = validPts.map((p,i)=> (i===0?'M':'L')+p[0]+','+p[1]).join(' ');
    lines += `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    lines += validPts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${s.color}"/>`).join('');
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">${grid}${lines}${axisLabels}</svg>`;
}

function statusChip(status){
  const map = {
    ready:['chip-ready','Placement Ready'], near:['chip-warn','Near Ready'], risk:['chip-risk','High Risk'],
    active:['chip-ready','Active'], pending:['chip-warn','Pending'], suspended:['chip-risk','Suspended'],
    'under review':['chip-warn','Under Review'], 'changes requested':['chip-risk','Changes Requested'],
    published:['chip-ready','Published'], draft:['chip-neutral','Draft'], archived:['chip-archived','Archived'],
    scheduled:['chip-scheduled','Scheduled'], live:['chip-ready','Live'], completed:['chip-completed','Completed'],
    cancelled:['chip-risk','Cancelled'],
  };
  const [cls,label] = map[status] || ['chip-neutral', status];
  return `<span class="chip ${cls}">${label}</span>`;
}
function avatarChip(name, size=30){
  const initials = name.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
  const colors = ['#1F9E93','#C9860F','#E4573D','#33436A','#146F67'];
  const color = colors[name.length % colors.length];
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:${color};font-size:${size*0.4}px;">${initials}</div>`;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Formats an ISO timestamp (as returned by GET /api/auth/sessions) into
// a short relative string — "Just now", "3 hours ago", "Yesterday",
// "5 days ago" — for the Active Sessions list on the Profile page.
// Falls back to '—' for missing/invalid dates.
function timeAgo(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '—';
  const diffMs = Date.now() - d.getTime();
  const min = Math.floor(diffMs/60000);
  if(min < 1) return 'Just now';
  if(min < 60) return `${min} min${min===1?'':'s'} ago`;
  const hr = Math.floor(min/60);
  if(hr < 24) return `${hr} hour${hr===1?'':'s'} ago`;
  const day = Math.floor(hr/24);
  if(day === 1) return 'Yesterday';
  if(day < 7) return `${day} days ago`;
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
}

/* Platform Overview infographic style per metric (index-aligned with KPIS,
   order/labels/values untouched) — 14 distinct infographic families drawn
   from sparklines/trend charts, bar/column charts, donut/semi/polar charts,
   linear/segmented/battery/thermometer progress, area/stream charts,
   lollipop rankings and bubble plots. No two adjacent items (same row or
   same column of the 4-up grid) share a style. */
const OV_STYLES = ['sparklineArea','trendSignal','verticalBars','donut','semiGauge','polarSpokes','hBar','segmented','battery','thermometer','stream','lollipop','bubble','groupedBars'];
function ovPercent(k){
  return k.value.includes('%') ? parseFloat(k.value) : Math.max(4, Math.min(100, 50 + k.trend*2));
}
function overviewInfographic(k, style){
  const up = k.trend>=0;
  const color = up ? 'var(--teal-dark)' : 'var(--rose-dark)';
  const pct = ovPercent(k);
  let svg, domeClass = 'ov-corner';
  switch(style){
    case 'sparklineArea': svg = ovSparklineAreaSVG(k.spark, color); break;
    case 'trendSignal': svg = ovTrendSignalSVG(k.trend, color, up); break;
    case 'verticalBars': svg = ovVerticalBarsSVG(k.spark, color); break;
    case 'donut': svg = ovDonutSVG(pct, color); domeClass='ov-center'; break;
    case 'semiGauge': svg = ovSemiGaugeSVG(pct, color); domeClass='ov-dome'; break;
    case 'polarSpokes': svg = ovPolarSpokesSVG(k.spark, color); break;
    case 'hBar': svg = ovHBarSVG(pct, color); domeClass='ov-top'; break;
    case 'segmented': svg = ovSegmentedSVG(pct, color); domeClass='ov-top'; break;
    case 'battery': svg = ovBatterySVG(pct, color); domeClass='ov-top'; break;
    case 'thermometer': svg = ovThermometerSVG(pct, color); domeClass='ov-top'; break;
    case 'stream': svg = ovStreamSVG(k.spark, color); break;
    case 'lollipop': svg = ovLollipopSVG(pct, color); break;
    case 'bubble': svg = ovBubbleSVG(k.spark, color); break;
    default: svg = ovGroupedBarsSVG(k.spark, color); break;
  }
  return `<div class="ov-item">
    <div class="ov-visual ${domeClass}">
      ${svg}
      <div class="ov-overlay">
        <div class="ov-ic" style="color:${KPI_FG[k.tone]}">${ic(k.icon)}</div>
        <div class="ov-value">${k.value}</div>
      </div>
    </div>
    <div class="ov-meta">
      <div class="ov-label">${k.label}</div>
      <span class="ov-trend ${up?'up':'down'}">${ic(up?'trendUp':'trendDown','icon icon-sm')}${up?'+':''}${k.trend}%</span>
    </div>
  </div>`;
}

/* ============================================================
   ADD COLLEGE MODULE (lives inside College Management)
   Real, backend-backed workflow — every step below hits MongoDB directly
   via GET/POST/PATCH/DELETE /api/admin/colleges(/:id/departments):
     1. Type a college name, click "Add College" -> POST /api/admin/colleges.
        The college is saved immediately and STAYS SELECTED (editingId is
        set to the real _id MongoDB returned) — this is what fixes the old
        bug where the college appeared to "disappear" while departments
        were being typed: previously nothing was saved until one big final
        submit, and the in-progress name lived only in local state that a
        department-add would inadvertently blow away on re-render.
     2. With the college selected, type a department name and click
        "Add Department" -> POST /api/admin/colleges/:id/departments.
        Each one is linked to the currently selected college and saved
        immediately; repeat as many times as needed.
     3. Click "Done" to close out and start a fresh college.
   Data shape: { id, collegeName, status, departments: [{ id, departmentName,
   status }] } — see MANAGED_COLLEGES above.
============================================================ */
function resetAddCollegeForm(){ addCollegeForm = { name:'', departments:[], editingId:null }; }

// Re-renders only the Add College card in place, so typing in the college
// name field never gets wiped out by an unrelated full renderPage().
function refreshAddCollegeCard(){
  const el = document.getElementById('addCollegeCard');
  if(el) el.innerHTML = addCollegeCardInner();
}

function addCollegeCardInner(){
  const selected = !!addCollegeForm.editingId;
  return `
  <div class="panel-bar"><span class="panel-dot pd-1"></span><span class="panel-dot pd-2"></span><span class="panel-dot pd-3"></span><span class="panel-title">${selected?'add departments':'add college'}</span></div>
  <div class="panel-body">
    <p class="desc" style="margin-bottom:14px;">${selected
      ? `<strong>${esc(addCollegeForm.name)}</strong> is saved and selected. Add its departments below — each is saved immediately and linked to this college.`
      : 'Add a college. Once saved it stays selected so you can add its departments next — both are immediately ready to power the college/department dropdowns on Student Registration and Create Quiz.'}</p>
    <div class="form-panel">
      <div class="form-group full">
        <label>College Name</label>
        <input type="text" id="acCollegeName" class="text-field" style="width:100%;" placeholder="e.g. KPR Institute of Engineering and Technology" value="${esc(addCollegeForm.name)}" oninput="addCollegeForm.name=this.value">
      </div>
      <div class="form-group full" style="display:flex;gap:10px;justify-content:flex-end;">
        <button type="button" class="btn btn-accent btn-sm" data-action="ac-save-college">${ic(selected?'check':'plus','icon icon-sm')}${selected?'Rename College':'Add College'}</button>
      </div>

      <div class="form-group full" style="margin-top:6px;">
        <label>Department</label>
        <div style="display:flex;gap:10px;">
          <input type="text" id="acDeptInput" class="text-field" style="flex:1;" placeholder="e.g. Computer Science and Engineering" ${selected?'':'disabled'}>
          <button type="button" class="btn btn-ghost btn-sm" data-action="ac-add-department" ${selected?'':'disabled'}>${ic('plus','icon icon-sm')}Add Department</button>
        </div>
        ${selected?'':`<p style="font-size:12px;color:var(--text-faint);margin-top:6px;">Save the college above first, then add its departments here.</p>`}
      </div>
      <div class="form-group full">
        ${addCollegeForm.departments.length ? `
        <div style="display:flex;flex-wrap:wrap;gap:8px;">
          ${addCollegeForm.departments.map(d=>`<span class="chip chip-neutral" style="padding:6px 8px 6px 12px;">${esc(d.departmentName)}<button type="button" data-action="ac-remove-department" data-id="${d.id}" title="Remove" style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;margin-left:2px;color:var(--text-faint);">${ic('x','icon icon-sm')}</button></span>`).join('')}
        </div>` : (selected ? `<p style="font-size:12px;color:var(--text-faint);">No departments added yet.</p>` : '')}
      </div>
      ${selected?`<div class="form-group full" style="display:flex;gap:10px;justify-content:flex-end;">
        <button type="button" class="btn btn-ghost btn-sm" data-action="ac-cancel-edit">Done</button>
      </div>`:''}
    </div>

    ${MANAGED_COLLEGES.length ? `
    <div style="margin-top:22px;padding-top:18px;border-top:1px solid var(--line);">
      <p class="desc" style="margin-bottom:12px;">Colleges added here (${MANAGED_COLLEGES.length})</p>

async function addDepartmentDraft(){
  if(!addCollegeForm.editingId){ showToast('Save the college first by clicking "Add College".', true); return; }
  const input = document.getElementById('acDeptInput');
  const val = (input?.value || '').trim();
  if(!val){ showToast('Enter a department name', true); return; }
  if(addCollegeForm.departments.some(d=>d.departmentName.toLowerCase()===val.toLowerCase())){
    showToast('That department is already in the list', true); return;
  }
  const res = await platformApiPost(`/admin/colleges/${addCollegeForm.editingId}/departments`, { collegeName: addCollegeForm.name, departmentName: val });
  if(!res.ok){ showToast(res.data.message || 'Could not add department.', true); return; }
  const d = res.data.department;
  const dept = { id: d._id, departmentName: d.department_name };
  addCollegeForm.departments.push(dept);
  const mc = MANAGED_COLLEGES.find(x=>x.id===addCollegeForm.editingId);
  if(mc) mc.departments.push(dept);
  refreshAddCollegeCard();
  const freshInput = document.getElementById('acDeptInput');
  if(freshInput) freshInput.focus();
}

function removeDepartmentDraft(deptId){
  const dept = addCollegeForm.departments.find(d=>d.id===deptId);
  openConfirm({icon:'trash', danger:true, title:'Remove this department?', message:`${dept?dept.departmentName:'This department'} will be permanently removed from this college. This cannot be undone.`, confirmLabel:'Remove', onConfirm: async ()=>{
    const res = await platformApiDelete(`/admin/departments/${deptId}`);
    if(!res.ok){ showToast(res.data.message || 'Could not remove department.', true); return; }
    addCollegeForm.departments = addCollegeForm.departments.filter(d=>d.id!==deptId);
    const mc = MANAGED_COLLEGES.find(x=>x.id===addCollegeForm.editingId);
    if(mc) mc.departments = mc.departments.filter(d=>d.id!==deptId);
    refreshAddCollegeCard();
    showToast('Department removed', true);
  }});
}
function startEditManagedCollege(id){
  const mc = MANAGED_COLLEGES.find(x=>x.id===id);
  if(!mc) return;
  addCollegeForm = { name:mc.collegeName, departments:[...mc.departments], editingId:id };
  refreshAddCollegeCard();
  document.getElementById('addCollegeCard')?.scrollIntoView({behavior:'smooth', block:'start'});
}
function cancelEditManagedCollege(){
  resetAddCollegeForm();
  refreshAddCollegeCard();
}
async function saveManagedCollege(){
  const name = (document.getElementById('acCollegeName')?.value || '').trim();
  if(!name){ showToast('College name cannot be empty', true); return; }

  if(!addCollegeForm.editingId){
    // Step 1: create the college right away. It comes back with a real
    // MongoDB _id, which we immediately select (editingId) — this is the
    // fix for "college disappears while adding departments": the college
    // is now a persisted record, not just unsaved text in an input.
    const res = await platformApiPost('/admin/colleges', { collegeName: name });
    if(!res.ok){ showToast(res.data.message || 'Could not add college.', true); return; }
    const c = res.data.college;
    MANAGED_COLLEGES.push({ id:c._id, collegeName:c.college_name, status:c.status, departments:[] });
    addCollegeForm = { name:c.college_name, departments:[], editingId:c._id };
    showToast(`${c.college_name} added — now add its departments below`);
  } else {
    const mc = MANAGED_COLLEGES.find(x=>x.id===addCollegeForm.editingId);
    if(mc && mc.collegeName === name){ showToast('Nothing to rename.'); return; }
    const res = await platformApiPatch(`/admin/colleges/${addCollegeForm.editingId}`, { collegeName: name });
    if(!res.ok){ showToast(res.data.message || 'Could not rename college.', true); return; }
    if(mc) mc.collegeName = name;
    addCollegeForm.name = name;
    showToast(`Renamed to ${name}`);
  }
  refreshAddCollegeCard();
}
function deleteManagedCollege(id){
  const mc = MANAGED_COLLEGES.find(x=>x.id===id);
  if(!mc) return;
  openConfirm({icon:'trash', danger:true, title:'Delete this college?', message:`This permanently removes ${mc.collegeName} and its ${mc.departments.length} department${mc.departments.length===1?'':'s'} from this list. This cannot be undone.`, confirmLabel:'Delete', onConfirm: async ()=>{
    const res = await platformApiDelete(`/admin/colleges/${id}`);
    if(!res.ok){ showToast(res.data.message || 'Could not delete college.', true); return; }
    MANAGED_COLLEGES = MANAGED_COLLEGES.filter(x=>x.id!==id);
    if(addCollegeForm.editingId===id) resetAddCollegeForm();
    showToast(`${mc.collegeName} deleted`, true);
    refreshAddCollegeCard();
  }});
}

// Renders the expanded Active Sessions list below the "Active sessions"
// count row — one row per session returned by GET /api/auth/sessions
// (see loadSessions()/SESSIONS). Fully dynamic: no device/browser/OS/
// timestamp values are hardcoded here, everything comes from the backend.
function renderSessionsList(){
  if(!SESSIONS.length){
    return `<div style="padding:10px 0;font-size:12.5px;color:var(--text-faint);">No active session data available.</div>`;
  }
  return SESSIONS.map(s=>{
    const device = s.device || s.deviceName || 'Unknown device';
    const browser = s.browser || '';
    const os = s.os || s.platform || '';
    const label = [browser, os].filter(Boolean).join(' on ') || device;
    const icon = /mobile|phone|android|iphone/i.test(device+browser+os) ? 'phone' : 'laptop';
    const isCurrent = !!(s.current || s.isCurrent);
    return `
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);">
      <div style="display:flex;gap:10px;align-items:flex-start;">
        ${ic(icon,'icon icon-sm')}
        <div>
          <div style="font-size:13px;font-weight:600;">${esc(device)}${device.toLowerCase()!==label.toLowerCase() ? ' · '+esc(label) : ''}</div>
          <div style="font-size:11.5px;color:var(--text-soft);">Last active: ${esc(timeAgo(s.lastActiveAt || s.lastActive))}${s.ip ? ' · '+esc(s.ip) : ''}</div>
          ${s.loginAt ? `<div style="font-size:11px;color:var(--text-faint);">Signed in ${esc(timeAgo(s.loginAt))}</div>` : ''}
        </div>
      </div>
      ${isCurrent ? `<span class="chip chip-ready" style="white-space:nowrap;">Current Session</span>`
        : `<button class="btn btn-ghost btn-xs" data-action="revoke-session" data-id="${esc(s.id||'')}">Revoke</button>`}
    </div>`;
  }).join('');
}

// Validates the profile form, PUTs the update to the backend, then
// refetches the latest saved profile (rather than trusting the local
// form values) so the page and topbar always reflect what's actually
// in the database. Mirrors the validate → save → refresh → toast flow
// used by the rest of the app's write actions.
async function saveProfile(){
  const nameEl = document.getElementById('profileName');
  const emailEl = document.getElementById('profileEmail');
  const phoneEl = document.getElementById('profilePhone');
  const btn = document.getElementById('saveProfileBtn');
  const name = nameEl?.value.trim() || '';
  const email = emailEl?.value.trim() || '';
  const phone = phoneEl?.value.trim() || '';

  if(!name){ showToast('Full name is required', true); return; }
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  if(!emailOk){ showToast('Enter a valid email address', true); return; }

  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  const res = await platformApiPut('/auth/profile', { name, email, phone });
  if(res.ok){
    await loadProfile(); // re-fetch from the backend rather than trusting the form
    if(STATE.page==='profile') renderPage();
    updateProfileChip();
    showToast('Profile updated');
  } else {
    showToast(res.data?.message || 'Could not update profile', true);
    if(btn){ btn.disabled = false; btn.textContent = 'Save Changes'; }
  }
}

// Revokes a single active session (any device other than the current
// one) via DELETE /auth/sessions/:id, then re-fetches the live list so
// the Profile page never shows a session that's actually been ended.
async function revokeSession(id){
  if(!id) return;
  const res = await platformApiDelete(`/auth/sessions/${encodeURIComponent(id)}`);
  if(res.ok){
    await loadSessions();
    showToast('Session revoked');
  } else {
    showToast(res.data?.message || 'Could not revoke session', true);
  }
}

/* ============================================================

============================================================ */
function showToast(message, danger=false){
  const root = document.getElementById('toast-root');
  const t = document.createElement('div');
  t.className = 'toast' + (danger?' danger':'');
  t.innerHTML = `${ic(danger?'alert':'check','icon icon-sm')}<span>${message}</span>`;
  root.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s, transform .3s'; t.style.opacity='0'; t.style.transform='translateY(8px)'; setTimeout(()=>t.remove(),300); }, 2600);
}

let PENDING_CONFIRM = null;
function openConfirm({icon='alert', tone='amber', title, message, confirmLabel='Confirm', danger=false, onConfirm, withInput=false, inputLabel='Email address', inputPlaceholder=''}){
  PENDING_CONFIRM = onConfirm;
  const root = document.getElementById('modal-root');
  root.innerHTML = `

    <div class="modal-box">
      <div class="modal-icon" style="background:${danger?'rgba(228,87,61,0.14)':'rgba(242,169,59,0.16)'};color:${danger?'var(--rose-dark)':'var(--amber-dark)'};">${ic(icon,'icon icon-lg')}</div>
      <div class="modal-body">
        <h3>${title}</h3>
        <p>${message}</p>
        ${withInput?`<div class="modal-input"><label>${inputLabel}</label><input type="text" class="text-field" style="width:100%;" id="confirmInput" placeholder="${inputPlaceholder}"></div>`:''}
        <div class="modal-actions">
          <button class="btn btn-ghost" data-action="modal-cancel">Cancel</button>

        </div>
      </div>
    </div>
  </div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; PENDING_CONFIRM=null; }
function downloadCSV(name){
  try{
    const rows = [['Report', name],['Generated', new Date().toLocaleString()],['Platform','Employability Intelligence Platform']];
    const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name.replace(/[^a-z0-9]+/gi,'_').toLowerCase()+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(e){ /* no-op — still show confirmation below */ }
  showToast(`"${name}" downloaded`);
}

/* ============================================================
   LIVE FILTERS
============================================================ */
function applyRowFilter(containerSelector, rowSelector, query, statusSel){
  const q = (query||'').toLowerCase().trim();
  const statusFilter = statusSel ? document.getElementById(statusSel)?.value : '';
  document.querySelectorAll(containerSelector+' '+rowSelector).forEach(row=>{
    const matchesText = !q || (row.dataset.search||'').includes(q);
    const matchesStatus = !statusFilter || row.dataset.status===statusFilter;
    row.style.display = (matchesText && matchesStatus) ? '' : 'none';
  });
}
/* Generalized filter for tables/grids with several independent <select> filters
   plus an optional search box — used by Quiz Management, Sessions, Trainers,
   and Attendance Records so admin can filter by College / Trainer / Status / Date. */
function applyMultiFilter(containerSelector, rowSelector, searchId, filterMap){
  const q = searchId ? (document.getElementById(searchId)?.value||'').toLowerCase().trim() : '';
  document.querySelectorAll(containerSelector+' '+rowSelector).forEach(row=>{
    let ok = !q || (row.dataset.search||'').includes(q);
    if(ok){
      for(const selId in filterMap){
        const val = document.getElementById(selId)?.value;
        const attr = filterMap[selId];
        if(val && val!=='all' && row.dataset[attr]!==val){ ok=false; break; }
      }
    }
    row.style.display = ok ? '' : 'none';
  });
}

/* ============================================================
   EVENT DELEGATION
============================================================ */
document.addEventListener('click', function(e){
  const modalHit = e.target.closest('[data-action="modal-cancel"], [data-action="modal-confirm"]');
  if(modalHit){
    const isBackdrop = modalHit.classList.contains('modal-overlay');
    if(isBackdrop && e.target!==modalHit){ /* click originated inside the modal box — ignore */ }
    else {
      if(modalHit.dataset.action==='modal-confirm' && typeof PENDING_CONFIRM==='function'){
        const input = document.getElementById('confirmInput');
        PENDING_CONFIRM(input?input.value:null);
      }
      closeModal();
    }
    return;
  }
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;
  const idx = el.dataset.idx;

  switch(action){
    case 'nav': {
      const page = el.dataset.page;
      goPage(page, {id});
      if(['verification','trainer-verification','student-verification'].includes(page)) refreshApprovalData();
      break;
    }
    case 'toggle-sidebar': document.getElementById('sidebar').classList.toggle('collapsed'); break;
    case 'open-mobile-sidebar': openMobileSidebar(); break;
    case 'close-mobile-sidebar': closeMobileSidebar(); break;
    case 'toggle-theme': { const html=document.documentElement; html.dataset.theme = html.dataset.theme==='dark'?'light':'dark'; break; }
    case 'toggle-switch': el.classList.toggle('on'); break;
    case 'tab': STATE.tab[el.dataset.group] = el.dataset.value; renderPage(); break;

    case 'download-report': downloadCSV(el.dataset.name); break;

    /* verification queue — backed by GET/PUT /api/auth (college admin) */
    case 'view-application': { const v=VERIFICATION_QUEUE.find(x=>x.id===id); openConfirm({icon:'fileText', title:v.college, message:`Admin: ${v.admin} · ${v.email} · ${v.phone}. Registered ${v.date}.`, confirmLabel:'Close', onConfirm:()=>{}}); break; }
    case 'verify-approve': { const v=VERIFICATION_QUEUE.find(x=>x.id===id); openConfirm({icon:'shieldCheck', title:'Approve this college?', message:`${v.college} will be activated and ${v.admin} will be able to log in immediately.`, confirmLabel:'Approve', onConfirm: async ()=>{
      const res = await authApiPut(`/approve/${v.id}`);
      if(res.ok){ showToast(`${v.college} approved`); await refreshApprovalData(); }
      else { showToast(res.data.message||'Could not approve this application.', true); }
    }}); break; }
    case 'verify-reject': { const v=VERIFICATION_QUEUE.find(x=>x.id===id); openConfirm({icon:'x', danger:true, title:'Reject this application?', message:`${v.college}'s registration will be rejected. The admin will be notified.`, confirmLabel:'Reject', onConfirm: async ()=>{
      const res = await authApiPut(`/reject/${v.id}`);
      if(res.ok){ showToast(`${v.college} rejected`, true); await refreshApprovalData(); }
      else { showToast(res.data.message||'Could not reject this application.', true); }
    }}); break; }
    // No pending/approved/rejected-only backend state exists for these three —
    // left as local, cosmetic actions (not persisted) since they're outside
    // the Pending → Approved/Rejected workflow the backend implements.

/* ============================================================
   RESPONSIVE NAV — mobile hamburger: slide-in, tap-outside-to-close,
   dedicated close button, Esc to close, and a simple focus trap
   while open (Tab/Shift+Tab stay inside the sidebar).
============================================================ */
let LAST_FOCUSED_EL = null;
function openMobileSidebar(){
  const sidebar = document.getElementById('sidebar');
  LAST_FOCUSED_EL = document.activeElement;
  sidebar.classList.add('mobile-open');
  document.getElementById('sidebarBackdrop').classList.add('show');
  document.getElementById('mobileMenuBtn')?.setAttribute('aria-expanded','true');
  document.body.style.overflow = 'hidden';
  const first = sidebar.querySelector('a.side-link, button');
  first && first.focus();
}
function closeMobileSidebar(){
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.remove('mobile-open');
  document.getElementById('sidebarBackdrop').classList.remove('show');
  document.getElementById('mobileMenuBtn')?.setAttribute('aria-expanded','false');
  document.body.style.overflow = '';
  if(LAST_FOCUSED_EL) LAST_FOCUSED_EL.focus();
}
document.addEventListener('keydown', function(e){
  const sidebar = document.getElementById('sidebar');
  const modalOpen = document.getElementById('modal-root').innerHTML.trim().length > 0;
  if(e.key==='Escape'){
    if(modalOpen){ closeModal(); closeBigModal(); return; }
    if(sidebar.classList.contains('mobile-open')){ closeMobileSidebar(); return; }
  }
  if(e.key==='Tab' && sidebar.classList.contains('mobile-open')){
    const focusables = sidebar.querySelectorAll('a.side-link, button:not([disabled])');
    if(!focusables.length) return;
    const firstEl = focusables[0], lastEl = focusables[focusables.length-1];
    if(e.shiftKey && document.activeElement===firstEl){ e.preventDefault(); lastEl.focus(); }
    else if(!e.shiftKey && document.activeElement===lastEl){ e.preventDefault(); firstEl.focus(); }
  }
  if(e.key==='Tab' && !sidebar.classList.contains('mobile-open')){
    const modal = document.querySelector('.sa-modal, .modal-box');
    if(!modal) return;
    const focusables = modal.querySelectorAll('a,button,input,select,textarea');
    if(!focusables.length) return;
    const firstEl = focusables[0], lastEl = focusables[focusables.length-1];
    if(e.shiftKey && document.activeElement===firstEl){ e.preventDefault(); lastEl.focus(); }
    else if(!e.shiftKey && document.activeElement===lastEl){ e.preventDefault(); firstEl.focus(); }
  }
});

function openBigModal(title, bodyHtml, footHtml, large){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
  <div class="sa-modal-overlay" data-action="close-big-modal">
    <div class="sa-modal ${large?'sa-modal-lg':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="sa-modal-head"><h3>${title}</h3><button class="sa-modal-close" data-action="close-big-modal" aria-label="Close">${ic('x','icon icon-sm')}</button></div>
      <div class="sa-modal-body" id="saModalBody">${bodyHtml}</div>
      <div class="sa-modal-foot">${footHtml}</div>
    </div>
  </div>`;
  const modal = root.querySelector('.sa-modal');
  const firstField = modal.querySelector('input,select,textarea,button');
  firstField && firstField.focus();
}
function closeBigModal(){ document.getElementById('modal-root').innerHTML=''; }

   Create-Quiz Interview Verification / Validation Verification —
   fully wired to the live backend (POST .../marks, POST .../validate).
   These two always persist to db.quiz_attempts and re-fetch afterwards
   so the table never shows a stale value.
------------------------------------------------------------ */
function openQuizInterviewMarksModal(idx){
  const r = QUIZ_INTERVIEW_VERIFICATION[idx];
  if(!r) return;
  const body = `
    <p style="font-weight:600;font-size:15px;margin-bottom:16px;">${esc(r.studentName||'—')} — ${esc(r.rollNumber||'—')} · ${esc(r.quizTitle||'—')} · Quiz ${r.percentageMarks!=null?r.percentageMarks+'%':'—'}</p>
    <div class="sa-field"><label>Interview Marks (0–100)</label><input type="number" min="0" max="100" id="quizIvScore" value="${r.interviewMarks!=null?r.interviewMarks:''}"></div>
    <p id="quizIvError" style="color:var(--rose-dark,#b91c1c);font-size:12.5px;display:none;"></p>
    <p style="font-size:12px;color:var(--text-soft);">Final Average = (Quiz % + Interview Marks) / 2. Cohort is assigned automatically from the current Placement Rules.</p>`;
  const foot = `<button class="btn btn-ghost" data-action="close-big-modal">Cancel</button><button class="btn btn-primary" data-action="save-quiz-interview-marks" data-idx="${idx}">Save</button>`;
  openBigModal('Enter Interview Marks', body, foot);
}

async function saveQuizInterviewMarks(idx){
  const r = QUIZ_INTERVIEW_VERIFICATION[idx];
  if(!r) return;
  const raw = document.getElementById('quizIvScore')?.value;
  const val = parseFloat(raw);
  const errEl = document.getElementById('quizIvError');
  if(raw==='' || isNaN(val) || val<0 || val>100){
    if(errEl){ errEl.textContent='Enter interview marks between 0 and 100.'; errEl.style.display='block'; }
    return;
  }
  const res = await platformApiPost(`/admin/quiz-interview-verification/${r.attemptId}/marks`, { marks: val });
  if(!res.ok){
    if(errEl){ errEl.textContent = res.data.message || 'Could not save interview marks.'; errEl.style.display='block'; }
    return;
  }
  closeBigModal();
  const cohortMsg = res.data.result && res.data.result.cohort ? ` — Final Average ${res.data.result.finalAverage}%, Cohort ${res.data.result.cohort}` : '';
  showToast(`Interview marks saved${cohortMsg}`, false);
  await Promise.all([loadQuizInterviewVerificationAdmin(), loadQuizValidationVerificationAdmin()]);
  renderPage();
}

async function validateQuizResultAdmin(idx){
  const r = QUIZ_VALIDATION_VERIFICATION[idx];
  if(!r) return;
  const res = await platformApiPost(`/admin/quiz-validation-verification/${r.attemptId}/validate`, {});
  if(!res.ok){ showToast(res.data.message || 'Could not validate this result.', true); return; }
  showToast('Result validated.', false);
  await loadQuizValidationVerificationAdmin();
  renderPage();
}

// re-renders when goPage()/renderPage() run, so a quiz that crosses from
// Scheduled into Live while an admin is already sitting on this table
// wouldn't visibly update until they navigated away and back. Poll while
// the Quizzes tab is actually the one on screen so the backend's status
// is reflected here without a manual refresh, per spec.

    const refreshed = await loadQuizzes();
    if (refreshed && STATE.page === 'assessments' && STATE.tab.assessments === 'quizzes') renderPage();

}, 30000);

// arrives, same pattern as the Quizzes poll above.
setInterval(async () => {

    await Promise.all([loadQuizResponses(), loadQuizAnalytics()]);
    if (STATE.page === 'assessments' && STATE.tab.assessments === 'responses') renderPage();

  </div>
</div>
`;
}

/* GET /api/public/colleges — single source of truth shared with Student
   Registration and the Trainer Create Quiz wizard. Returns [] if the
   endpoint isn't reachable yet or has no active colleges; the UI shows
   "No colleges available." until real data exists. Pointed at superadmin's
   own platformApiGet + /public/colleges instead of trainer.html's publicApi
   — the only behavioural adaptation made to fit this app. */
async function getColleges(){
  const res = await platformApiGet('/public/colleges');
  const arr = res.ok ? pickArray(res.data, 'colleges') : null;
  if (!arr) return [];
  return arr.map(c => ({ id: String(c._id), name: c.college_name }));
}
/* GET /assessment/sections — production contract, no hardcoded fallback.
   Drives both the Section Distribution panel and each manual question's
   assigned section. Returns [] until the backend has sections configured.
   Pointed at /admin/assessment/sections instead of trainer.html's
   /assessment/sections — the only other behavioural adaptation. */
async function getSections(){
  const res = await platformApiGet('/admin/assessment/sections');
  if(res.ok && Array.isArray(res.data)){
    return res.data.map(s => ({ id: String(s.id), name: s.name }));
  }
  if(res.ok && Array.isArray(res.data.sections)){
    return res.data.sections.map(s => ({ id: String(s.id), name: s.name }));
  }
  return [];
}

/* ---------------------------------------------------------------- Step 1: Assessment Details ---------------------------------------------------------------- */
function onQuizTypeChange(type){

// datetime-local inputs give "YYYY-MM-DDTHH:mm" with NO timezone offset —
// new Date(...) parses that as the browser's *local* time, so .toISOString()
// correctly converts it to UTC. Sending the raw string instead (as before)
// made the backend interpret the trainer's local wall-clock time as if it
// were already UTC, shifting every quiz's Live window by the trainer's UTC
// offset — the root cause of quizzes not appearing when expected.
function localInputToISO(value){
  if(!value) return '';
  const d = new Date(value);
  return isNaN(d.getTime()) ? '' : d.toISOString();
}
// Inverse, for repopulating a datetime-local input from a stored UTC ISO
// string when editing an existing quiz.
function isoToLocalInput(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function collectStep1(){
  return {
    name: document.getElementById('qzName').value.trim(),
    cohort: document.getElementById('qzCohort').value,
    colleges: Array.from(qzCollegesSelected),
    collegeNames: qzColleges.filter(c=>qzCollegesSelected.has(c.id)).map(c=>c.name),
    start: localInputToISO(document.getElementById('qzStart').value),
    end: localInputToISO(document.getElementById('qzEnd').value),
    duration: parseInt(document.getElementById('qzDuration').value) || 0,
    quizType: getQuizType(),
  };
}
function validateStep1(){
  const errEl = document.getElementById('qzStep1Error');
  const fail = (msg)=>{ errEl.textContent = msg; errEl.style.display=''; return false; };
  const d = collectStep1();
  if(!d.name) return fail('Assessment name is required.');
  if(!d.colleges.length) return fail('Select at least one applicable college.');
  if(!d.start || !d.end) return fail('Both quiz start and end date/time are required.');
  if(new Date(d.end) <= new Date(d.start)) return fail('End date must be greater than start date.');
  if(!d.duration || d.duration < 1) return fail('Enter the quiz duration in minutes.');
  errEl.style.display = 'none';
  return true;
}

/* ---------------------------------------------------------------- Step 2: Section Distribution (8 fields per section) ---------------------------------------------------------------- */
/* Sections come from GET /assessment/sections — nothing here is
   hardcoded. For every section the admin configures 8 numbers:
     Hard/Medium/Easy Available  (the pool actually authored/uploaded)
     Hard/Medium/Easy Display    (how many of those a student receives)
   with Available = sum of its 3 Available fields and Display = sum of
   its 3 Display fields, enforced live here and re-verified authoritatively
   by quiz_module.validate_section_config() on the backend before save. */
async function ensureSectionsLoaded(){
  if(qzSections.length) return;
  qzSections = await getSections();
  qzSections.forEach(s => { if(!qzSectionConfig[s.name]) qzSectionConfig[s.name] = blankSectionConfig(); });
}
function blankSectionConfig(){
  return { hardAvailable:0, mediumAvailable:0, easyAvailable:0, hardDisplay:0, mediumDisplay:0, easyDisplay:0 };
}
async function renderSectionDistributionPanel(){
  document.getElementById('qzSectionDistLoading').style.display = '';
  document.getElementById('qzSectionDistRows').style.display = 'none';
  document.getElementById('qzSectionDistTotalWrap').style.display = 'none';
  await ensureSectionsLoaded();
  if(!qzSections.length){
    document.getElementById('qzSectionDistLoading').innerHTML = `<div class="e-ic">▦</div>No assessment sections configured yet — ask your Super Admin to add sections before creating a quiz.`;
    return;
  }
  document.getElementById('qzSectionDistLoading').style.display = 'none';
  const isBulk = getQuizType()==='bulk';
  const isBank = getQuizType()==='question_bank';
  if(isBank){
    // Part 6: Question Bank mode skips upload/authoring entirely — Available
    // always comes live from the shared QuestionBank, refreshed every time
    // this step is opened so it can never go stale mid-session.
    const res = await platformApiGet('/admin/question-bank/summary');
    qzBankAvailability = (res.ok && res.data.summary) ? res.data.summary : {};
    qzSections.forEach(s => {
      const bank = qzBankAvailability[s.name] || { hard:0, medium:0, easy:0 };
      const cfg = qzSectionConfig[s.name] || (qzSectionConfig[s.name] = blankSectionConfig());
      cfg.hardAvailable = bank.hard || 0;
      cfg.mediumAvailable = bank.medium || 0;
      cfg.easyAvailable = bank.easy || 0;
    });
  }
  document.getElementById('qzSectionModeHint').textContent = isBank
    ? "Question Bank: Available counts are read-only, live from the platform's shared Question Bank. Click a section's Update button to set how many of each to Display — a fresh random set is drawn when you publish."
    : isBulk
    ? "Bulk Upload: Available counts are read-only, auto-filled from your uploaded Excel file. Click a section's Update button to review and set how many of each to Display."
    : "Manual Entry: click a section's Update button to enter how many Hard/Medium/Easy questions you'll author (Available) and how many of each to Display to a student.";
  renderSectionDistribution();
}
/* Clean, uncluttered cards — one per assessment section — showing only
   basic info (name + running Available/Display totals) plus a single
   Update button. No per-field inputs live on the main page; all detailed
   Easy/Medium/Hard Available/Display editing happens in the section-scoped
   qzStatsModal opened via openQuizStatsModal(sectionName). */
function renderSectionDistribution(){
  const wrap = document.getElementById('qzSectionDistRows');
  wrap.style.display = '';
  wrap.innerHTML = qzSections.map(s => {
    const cfg = qzSectionConfig[s.name] || (qzSectionConfig[s.name] = blankSectionConfig());
    const avail = cfg.hardAvailable + cfg.mediumAvailable + cfg.easyAvailable;
    const disp = cfg.hardDisplay + cfg.mediumDisplay + cfg.easyDisplay;
    const dispOk = disp <= avail;
    return `<div class="section-count-row">
      <div>
        <div class="sc-label">${escAttr(s.name)}</div>
        <div style="font-size:12px;color:var(--text-soft);margin-top:2px;">Available: <span class="mono">${avail}</span> &nbsp;•&nbsp; To Display: <span class="mono" style="color:${dispOk?'inherit':'var(--rose)'};">${disp}</span></div>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" style="text-transform:none;letter-spacing:normal;font-weight:600;" onclick="openQuizStatsModal('${escAttr(s.name)}')">✎ Update</button>
    </div>`;
  }).join('');
  updateSectionDistTotal();
}
function setSectionField(sectionName, field, val){
  const cfg = qzSectionConfig[sectionName] || (qzSectionConfig[sectionName] = blankSectionConfig());
  cfg[field] = Math.max(0, parseInt(val) || 0);
  renderSectionDistribution();
  if(getQuizType()==='manual' && field.endsWith('Available')) buildManualQueueFromSectionConfig();
}
function sectionConfigTotals(){
  let available = 0, display = 0;
  qzSections.forEach(s => {
    const cfg = qzSectionConfig[s.name] || blankSectionConfig();
    available += cfg.hardAvailable + cfg.mediumAvailable + cfg.easyAvailable;
    display += cfg.hardDisplay + cfg.mediumDisplay + cfg.easyDisplay;
  });
  return { available, display };
}
function updateSectionDistTotal(){
  const { available, display } = sectionConfigTotals();
  const totalWrap = document.getElementById('qzSectionDistTotalWrap');
  totalWrap.style.display = '';
  document.getElementById('qzSectionDistTotal').textContent = `${available} / ${display}`;
  const errEl = document.getElementById('qzSectionDistError');
  const ok = available > 0 && display > 0 && display <= available;
  if(!ok){
    errEl.textContent = available===0 ? 'Configure at least one section with Available questions.'
      : (display===0 ? 'Set how many questions to Display for at least one section.' : 'Total to Display cannot exceed Total Available.');
  }
  errEl.style.display = ok ? 'none' : '';
  totalWrap.querySelector('span:last-child').style.color = ok ? 'var(--teal-dark)' : 'var(--rose)';
  updateFooterLabels();
  return ok;
}
function validateSectionDistribution(){
  if(!qzSections.length){
    document.getElementById('qzSectionDistError').textContent = 'Add assessment sections before continuing.';
    document.getElementById('qzSectionDistError').style.display = '';
    return false;
  }
  return updateSectionDistTotal();
}

/* ---------------------------------------------------------------- "Update" modal: per-section Available/Display editor ----------------------------------------------------------------
   Each assessment section card on the main Step 2 page carries its own
   Update button (see renderSectionDistribution). Clicking it opens this
   modal scoped to exactly that one section — qzStatsSectionName (a hidden
   field) tracks which section is currently being edited. The modal shows
   only that section's Total Available / Total to be Displayed plus its
   Easy/Medium/Hard Available + Display breakdown. Saving writes the new
   numbers back into qzSectionConfig[sectionName] only — every other
   section's data is left completely untouched — then re-renders the
   Section Distribution cards + manual question queue and closes the modal. */
async function openQuizStatsModal(sectionName){
  await ensureSectionsLoaded();
  if(!qzSections.length){ showToast('Add assessment sections before updating question distribution.', true); return; }
  if(!sectionName || !qzSectionConfig.hasOwnProperty(sectionName)){
    showToast('Select a section to update.', true);
    return;
  }
  const isBulk = getQuizType()==='bulk';
  const isBank = getQuizType()==='question_bank';
  const cfg = qzSectionConfig[sectionName] || (qzSectionConfig[sectionName] = blankSectionConfig());
  document.getElementById('qzStatsSectionName').value = sectionName;
  document.getElementById('qzStatsModalTitle').textContent = `Update Question Distribution — ${sectionName}`;
  document.getElementById('qzStatsEasyAvail').value = cfg.easyAvailable;
  document.getElementById('qzStatsMediumAvail').value = cfg.mediumAvailable;
  document.getElementById('qzStatsHardAvail').value = cfg.hardAvailable;
  document.getElementById('qzStatsEasyDisplay').value = cfg.easyDisplay;
  document.getElementById('qzStatsMediumDisplay').value = cfg.mediumDisplay;
  document.getElementById('qzStatsHardDisplay').value = cfg.hardDisplay;
  ['qzStatsEasyAvail','qzStatsMediumAvail','qzStatsHardAvail'].forEach(id => {
    const el = document.getElementById(id);
    el.readOnly = isBulk || isBank;
    el.style.background = (isBulk||isBank) ? 'var(--paper-raised)' : '';
    el.style.cursor = (isBulk||isBank) ? 'not-allowed' : '';
  });
  document.getElementById('qzStatsHint').textContent = isBank
    ? `Available counts for ${sectionName} are live from the shared Question Bank and are read-only here. Adjust how many of each difficulty to Display — a fresh random set is drawn from the bank when you publish.`
    : isBulk
    ? `Available counts for ${sectionName} come from your uploaded Excel file and are pre-filled/read-only here. Adjust how many of each difficulty to Display.`
    : `Adjust how many questions are Available (the pool you'll author for ${sectionName}) and how many to Display to each student, by difficulty.`;
  updateQzStatsTotals();
  document.getElementById('qzStatsError').style.display = 'none';
  document.getElementById('qzStatsModal').style.display = 'flex';
}
function updateQzStatsTotals(){
  const easyAvail = Math.max(0, parseInt(document.getElementById('qzStatsEasyAvail').value) || 0);
  const medAvail = Math.max(0, parseInt(document.getElementById('qzStatsMediumAvail').value) || 0);
  const hardAvail = Math.max(0, parseInt(document.getElementById('qzStatsHardAvail').value) || 0);
  const easyDisp = Math.max(0, parseInt(document.getElementById('qzStatsEasyDisplay').value) || 0);
  const medDisp = Math.max(0, parseInt(document.getElementById('qzStatsMediumDisplay').value) || 0);
  const hardDisp = Math.max(0, parseInt(document.getElementById('qzStatsHardDisplay').value) || 0);
  const totalAvail = easyAvail + medAvail + hardAvail;
  const totalDisp = easyDisp + medDisp + hardDisp;
  document.getElementById('qzStatsTotal').textContent = `${totalAvail} / ${totalDisp}`;
  const errEl = document.getElementById('qzStatsError');
  const ok = totalDisp <= totalAvail;
  errEl.textContent = ok ? '' : 'Total to be Displayed cannot exceed Total Available.';
  errEl.style.display = ok ? 'none' : '';
  document.getElementById('qzStatsTotal').style.color = ok ? 'var(--teal-dark)' : 'var(--rose)';
  return { easyAvailable:easyAvail, mediumAvailable:medAvail, hardAvailable:hardAvail, easyDisplay:easyDisp, mediumDisplay:medDisp, hardDisplay:hardDisp, ok };
}
function closeQuizStatsModal(){ const el = document.getElementById('qzStatsModal'); if(el) el.style.display = 'none'; }
function saveQuizStatsModal(){
  const sectionName = document.getElementById('qzStatsSectionName').value;
  if(!sectionName){ closeQuizStatsModal(); return; }
  const isBulk = getQuizType()==='bulk';
  const isBank = getQuizType()==='question_bank';
  const stats = updateQzStatsTotals();
  if(!stats.ok){ return; }
  if(isBulk || isBank){
    // Available is read-only in both modes — auto-filled from the
    // uploaded file (Bulk) or the live shared bank (Question Bank).
    // Only this section's Display split can actually change here.
    const current = qzSectionConfig[sectionName] || blankSectionConfig();
    stats.easyAvailable = current.easyAvailable;
    stats.mediumAvailable = current.mediumAvailable;
    stats.hardAvailable = current.hardAvailable;
    if(stats.easyDisplay + stats.mediumDisplay + stats.hardDisplay > stats.easyAvailable + stats.mediumAvailable + stats.hardAvailable){
      document.getElementById('qzStatsError').textContent = 'Total to be Displayed cannot exceed Total Available.';
      document.getElementById('qzStatsError').style.display = '';
      return;
    }
  }
  // Update only this section's entry in qzSectionConfig — every other
  // section's config object is left exactly as it was.
  qzSectionConfig[sectionName] = {
    easyAvailable: stats.easyAvailable, mediumAvailable: stats.mediumAvailable, hardAvailable: stats.hardAvailable,
    easyDisplay: stats.easyDisplay, mediumDisplay: stats.mediumDisplay, hardDisplay: stats.hardDisplay
  };
  renderSectionDistribution();
  if(getQuizType()==='manual') buildManualQueueFromSectionConfig();
  closeQuizStatsModal();
  showToast(`${sectionName} question distribution updated`);
}

/* ---------------------------------------------------------------- Step 2: Manual Entry ---------------------------------------------------------------- */
/* Builds/rebuilds the manual-entry queue directly from qzSectionConfig's
   *Available counts — one slot per Available question, grouped Hard block
   then Medium block then Easy block within each section, sections in the
   order returned by GET /assessment/sections. Already-entered text/options
   are preserved by keying on (section, difficulty, position-within-that-
   difficulty-bucket) so tweaking one section's counts doesn't wipe out
   work already done on the others. */
function buildManualQueueFromSectionConfig(){
  const existingByKey = {};
  qzQuestions.forEach(q => {
    const key = `${q.section}|${q.difficulty}`;
    (existingByKey[key] = existingByKey[key] || []).push(q);
  });
  const next = [];
  qzSections.forEach(s => {
    const cfg = qzSectionConfig[s.name] || blankSectionConfig();
    [['Hard','hardAvailable'],['Medium','mediumAvailable'],['Easy','easyAvailable']].forEach(([label, field]) => {
      const count = cfg[field] || 0;
      const bucket = existingByKey[`${s.name}|${label}`] || [];
      for(let i=0;i<count;i++){
        next.push(bucket[i] || blankQuestion(s.name, label));
      }
    });
  });
  qzQuestions = next;
  if(qzCurrentQIndex >= qzQuestions.length) qzCurrentQIndex = Math.max(0, qzQuestions.length-1);
  renderQuestionPager();
  updateFooterLabels();
}
function isQuestionComplete(q){
  if(!q) return false;
  const filledOptions = (q.options||[]).filter(o=>o && String(o).trim()).length;
  const correctCount = (q.correct||[]).length;
  const correctOk = q.type==='single_choice' ? correctCount===1 : correctCount>=1;
  return !!(q.text && q.text.trim()) && filledOptions>=2 && correctOk && !!q.type &&
    q.marks!=='' && q.marks!=null && !isNaN(parseFloat(q.marks));
}
function renderQuestionPager(){
  document.getElementById('qManualPager').innerHTML = qzQuestions.map((q,i)=>
    `<div class="qnav-dot ${i===qzCurrentQIndex?'current':''} ${isQuestionComplete(q)?'complete':''}" onclick="goToQuestion(${i})" title="${escAttr(q.section)} · ${escAttr(q.difficulty)}">${i+1}</div>`
  ).join('');
}
function goToQuestion(i){
  if(i<0 || i>=qzQuestions.length) return;
  autosaveCurrentQuestion(true);
  qzCurrentQIndex = i;
  renderCurrentQuestion();
}
function renderCurrentQuestion(){
  const n = qzQuestions.length;
  const q = qzQuestions[qzCurrentQIndex] || blankQuestion();
  document.getElementById('qManualTitle').textContent = `Question ${n ? qzCurrentQIndex+1 : 0} of ${n}`;
  const completeCount = qzQuestions.filter(isQuestionComplete).length;
  document.getElementById('qManualProgress').textContent = `${completeCount} of ${n} questions complete`;
  const complete = isQuestionComplete(q);
  const chip = document.getElementById('qCurrentStatusChip');
  chip.textContent = complete ? 'Complete' : 'Incomplete';
  chip.className = 'q-status-chip ' + (complete ? 'complete' : 'incomplete');

  document.getElementById('qManualSectionTag').textContent = n
    ? `Question order follows Section Distribution below — Section and Difficulty are set automatically.` : '';
  document.getElementById('qPrevQBtn').disabled = qzCurrentQIndex<=0;
  document.getElementById('qNextQBtn').disabled = qzCurrentQIndex>=n-1;
  document.getElementById('qText').value = q.text;
  document.getElementById('qType').value = q.type || 'single_choice';
  renderOptionsGrid(q);
  document.getElementById('qDifficultyBadge').value = q.difficulty || '—';
  document.getElementById('qSectionBadge').value = q.section || '—';
  document.getElementById('qMarks').value = q.marks === '' || q.marks == null ? '' : q.marks;
  document.getElementById('qExplanation').value = q.explanation || '';
  document.getElementById('qzManualError').style.display = 'none';
  renderQuestionPager();
  updateFooterLabels();
}
function renderOptionsGrid(q){
  const letters = ['A','B','C','D'];
  const inputType = q.type==='single_choice' ? 'radio' : 'checkbox';
  document.getElementById('qOptionsGrid').innerHTML = letters.map((L,i)=>`
    <div class="answer-opt ${(q.correct||[]).includes(i)?'is-correct':''}">
      <input type="${inputType}" name="qCorrectRadio" ${(q.correct||[]).includes(i)?'checked':''} onchange="toggleCorrectOption(${i}, this.checked)">
      <span class="opt-letter">${L}</span>
      <input type="text" placeholder="Option ${L}" value="${escAttr(q.options[i])}" oninput="onOptionInput(${i}, this.value)">
    </div>`).join('');
  document.getElementById('qAnswerHint').textContent = q.type==='single_choice'
    ? 'Select the one correct option.'
    : 'Check every correct option — more than one is allowed for Multiple Choice.';
}
/* Issue 5: switching Type re-validates/clamps the current selection —
   Single Choice keeps only the first checked answer, Multiple Choice is
   left as-is. */
function onQuestionTypeChange(){
  const q = qzQuestions[qzCurrentQIndex]; if(!q) return;
  q.type = document.getElementById('qType').value;
  if(q.type==='single_choice' && q.correct.length>1) q.correct = [q.correct[0]];
  renderOptionsGrid(q);
  scheduleAutosave();
}
function onOptionInput(i, val){
  const q = qzQuestions[qzCurrentQIndex]; if(!q) return;
  q.options[i] = val;
  scheduleAutosave();
}
function toggleCorrectOption(i, checked){
  const q = qzQuestions[qzCurrentQIndex]; if(!q) return;
  if(q.type==='single_choice'){
    q.correct = checked ? [i] : [];               // Single Choice: only one answer, previous selection auto-unchecked
  } else if(checked){
    if(!q.correct.includes(i)) q.correct.push(i);   // Multiple Choice: any number of answers
  } else {
    q.correct = q.correct.filter(x=>x!==i);
  }
  renderOptionsGrid(q);
  scheduleAutosave();
}
function scheduleAutosave(){
  clearTimeout(qzAutosaveTimer);
  qzAutosaveTimer = setTimeout(()=>autosaveCurrentQuestion(false), 450);
}
/* Auto-save draft when navigating between questions (and shortly after
   any edit). Mirrors PUT /api/trainer/assessments/draft once wired up. */
function autosaveCurrentQuestion(silent){
  const q = qzQuestions[qzCurrentQIndex]; if(!q) return;
  q.text = document.getElementById('qText').value;
  q.type = document.getElementById('qType').value;
  // q.difficulty / q.section are auto-assigned by buildManualQueueFromSectionConfig() — never user-edited.
  q.marks = document.getElementById('qMarks').value;
  q.explanation = document.getElementById('qExplanation').value;
  const complete = isQuestionComplete(q);
  const chip = document.getElementById('qCurrentStatusChip');
  chip.textContent = complete ? 'Complete' : 'Incomplete';
  chip.className = 'q-status-chip ' + (complete ? 'complete' : 'incomplete');
  renderQuestionPager();
  const completeCount = qzQuestions.filter(isQuestionComplete).length;
  document.getElementById('qManualProgress').textContent = `${completeCount} of ${qzQuestions.length} questions complete`;
  if(!silent) persistDraftSilently();
}
function persistDraftSilently(){
  clearTimeout(qzDraftPersistTimer);
  qzDraftPersistTimer = setTimeout(async ()=>{
    const res = await platformApiPut('/admin/quizzes/draft', buildDraftPayload());
    if(res.ok && res.data.id && !qzEditingId) qzDraftId = res.data.id;
  }, 800);
}

/* ---------------------------------------------------------------- Step 2: Bulk Upload ---------------------------------------------------------------- */
