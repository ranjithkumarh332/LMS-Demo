<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Admin — Employability Intelligence Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   0. DESIGN TOKENS — carried over from the platform's marketing
   theme (index(2).html): Ink/Paper/Amber/Teal/Rose palette,
   Fraunces display + Inter body + JetBrains Mono utility, the
   "OS-window" chrome motif, and light/dark mode via [data-theme].
============================================================ */
:root{
  --ink:#12203B; --ink-soft:#33436A;
  --paper:#F6F5F1; --paper-raised:#FFFFFF; --paper-sunk:#EFEDE6;
  --line:#DAD4C6;
  --amber:#F2A93B; --amber-dark:#C9860F;
  --teal:#1F9E93; --teal-dark:#146F67;
  --rose:#E4573D; --rose-dark:#B8402A;
  --text:#171B24; --text-soft:#5B6070; --text-faint:#9096A5;
  --radius-sm:8px; --radius-md:16px; --radius-lg:28px; --radius-pill:100px;
  --shadow-sm: 0 2px 8px rgba(18,32,59,0.06);
  --shadow-md: 0 12px 32px rgba(18,32,59,0.10);
  --shadow-lg: 0 24px 64px rgba(18,32,59,0.16);
  --font-display:'Fraunces', serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
  --transition: 0.3s cubic-bezier(.22,1,.36,1);
  --sidebar-w: 268px; --sidebar-w-c: 84px; --topbar-h: 72px;
}
[data-theme="dark"]{
  --ink:#EDEBE3; --ink-soft:#B9BFCF;
  --paper:#0B101C; --paper-raised:#141B2C; --paper-sunk:#0F1524;
  --line:#293049;
  --text:#EDEBE3; --text-soft:#9BA0B4; --text-faint:#666E85;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.35);
  --shadow-md: 0 12px 32px rgba(0,0,0,0.5);
  --shadow-lg: 0 24px 64px rgba(0,0,0,0.6);
}
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; }
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important; }
}
body{
  font-family:var(--font-body); background:var(--paper); color:var(--text);
  line-height:1.5; overflow-x:hidden; transition:background var(--transition), color var(--transition);
  -webkit-font-smoothing:antialiased;
}
img,svg{ max-width:100%; display:block; }
a{ color:inherit; text-decoration:none; }
ul{ list-style:none; }
button,input,select,textarea{ font-family:inherit; color:inherit; }
button{ cursor:pointer; border:none; background:none; }
h1,h2,h3,h4{ font-family:var(--font-display); font-weight:600; line-height:1.15; letter-spacing:-0.01em; }
::selection{ background:var(--amber); color:var(--ink); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--teal); outline-offset:2px; border-radius:4px;
}
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--line); border-radius:10px; }

.eyebrow{ font-family:var(--font-mono); font-size:11.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--teal-dark); display:inline-flex; align-items:center; gap:8px; font-weight:600; }
[data-theme="dark"] .eyebrow{ color:var(--teal); }

/* buttons -------------------------------------------------- */
.btn{ font-weight:600; font-size:14px; padding:10px 18px; border-radius:var(--radius-pill); display:inline-flex; align-items:center; gap:7px; transition:transform var(--transition), box-shadow var(--transition), background var(--transition), color var(--transition), border-color var(--transition); white-space:nowrap; }
.btn-primary{ background:var(--ink); color:var(--paper); box-shadow:var(--shadow-sm); }
.btn-primary:hover{ transform:translateY(-2px); box-shadow:var(--shadow-md); }
.btn-ghost{ color:var(--text); border:1px solid var(--line); background:var(--paper-raised); }
.btn-ghost:hover{ border-color:var(--ink-soft); transform:translateY(-1px); }
.btn-accent{ background:var(--amber); color:#1B1300; box-shadow:var(--shadow-sm); }
.btn-accent:hover{ transform:translateY(-2px); box-shadow:var(--shadow-md); background:var(--amber-dark); }
.btn-danger{ background:var(--rose); color:#fff; }
.btn-danger:hover{ background:var(--rose-dark); transform:translateY(-2px); }
.btn-teal{ background:var(--teal); color:#fff; }
.btn-teal:hover{ background:var(--teal-dark); transform:translateY(-2px); }
.btn-sm{ padding:7px 14px; font-size:12.5px; }
.btn-xs{ padding:5px 10px; font-size:11.5px; border-radius:8px; }
.btn-icon{ width:38px; height:38px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; padding:0; border:1px solid var(--line); background:var(--paper-raised); transition:all var(--transition); }
.btn-icon:hover{ border-color:var(--ink-soft); transform:translateY(-1px); }
.btn[disabled]{ opacity:.45; pointer-events:none; }
.icon{ width:17px; height:17px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.icon-sm{ width:14px; height:14px; }
.icon-lg{ width:22px; height:22px; }

/* ============================================================
   1. APP SHELL
============================================================ */
.admin-shell{ display:flex; min-height:100vh; }

/* --- sidebar --- */
.sidebar{
  width:var(--sidebar-w); flex:none; background:var(--ink); color:#EEF0F6;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; z-index:200;
  transition:width var(--transition), transform var(--transition);
}
.sidebar.collapsed{ width:var(--sidebar-w-c); }
.sidebar-brand{ display:flex; align-items:center; gap:11px; padding:22px 20px; border-bottom:1px solid rgba(255,255,255,0.08); min-height:var(--topbar-h); }
.brand-mark{ width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg, var(--amber), var(--rose)); display:flex; align-items:center; justify-content:center; color:#1B1300; font-weight:800; font-size:14px; font-family:var(--font-mono); flex:none; box-shadow:var(--shadow-sm); }
.brand-text{ font-family:var(--font-display); font-weight:700; font-size:16.5px; color:#fff; overflow:hidden; white-space:nowrap; opacity:1; transition:opacity .2s var(--transition); }
.sidebar.collapsed .brand-text{ opacity:0; width:0; }
.brand-text small{ display:block; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:rgba(238,240,246,0.45); font-weight:600; margin-top:2px; }

.sidebar-scroll{ flex:1; overflow-y:auto; padding:14px 12px 20px; }
.side-section-label{ font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:rgba(238,240,246,0.32); padding:16px 12px 8px; white-space:nowrap; }
.sidebar.collapsed .side-section-label{ opacity:0; height:0; padding:8px 0 0; overflow:hidden; }
.side-nav{ display:flex; flex-direction:column; gap:2px; }
.side-link{ display:flex; align-items:center; gap:12px; padding:10.5px 12px; border-radius:12px; color:rgba(238,240,246,0.68); font-size:14px; font-weight:500; position:relative; transition:background var(--transition), color var(--transition); white-space:nowrap; overflow:hidden; }
.side-link .icon{ flex:none; }
.side-link:hover{ background:rgba(255,255,255,0.06); color:#fff; }
.side-link.active{ background:rgba(242,169,59,0.14); color:#fff; }
.side-link.active::before{ content:''; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:3px; background:linear-gradient(180deg, var(--amber), var(--rose)); }
.side-link .label{ overflow:hidden; text-overflow:ellipsis; }
.sidebar.collapsed .side-link .label, .sidebar.collapsed .side-link .count{ display:none; }
.sidebar.collapsed .side-link{ justify-content:center; }
.side-link .count{ margin-left:auto; font-family:var(--font-mono); font-size:10.5px; background:rgba(255,255,255,0.1); padding:2px 7px; border-radius:20px; color:rgba(238,240,246,0.8); }

.sidebar-foot{ padding:14px; border-top:1px solid rgba(255,255,255,0.08); }
.sidebar-collapse-btn{ width:100%; display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:12px; color:rgba(238,240,246,0.55); font-size:12.5px; font-weight:600; }
.sidebar-collapse-btn:hover{ background:rgba(255,255,255,0.06); color:#fff; }
.sidebar.collapsed .sidebar-collapse-btn .label{ display:none; }
.sidebar.collapsed .sidebar-collapse-btn{ justify-content:center; }
.sidebar.collapsed .sidebar-collapse-btn .icon{ transform:rotate(180deg); }

/* --- topbar --- */
.main-col{ flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar{ position:sticky; top:0; z-index:150; height:var(--topbar-h); display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 28px; background:rgba(246,245,241,0.82); backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%); border-bottom:1px solid var(--line); }
[data-theme="dark"] .topbar{ background:rgba(11,16,28,0.82); }
.topbar-left{ display:flex; align-items:center; gap:16px; min-width:0; }
.mobile-menu-btn{ display:none; }
.page-title-wrap{ min-width:0; }
.page-title-wrap h1{ font-size:19px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.breadcrumb{ font-family:var(--font-mono); font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; display:flex; align-items:center; gap:6px; margin-bottom:2px; }
.breadcrumb a{ color:var(--text-faint); }
.breadcrumb a:hover{ color:var(--teal-dark); }
.topbar-right{ display:flex; align-items:center; gap:10px; flex:none; }
.search-box{ display:flex; align-items:center; gap:8px; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-pill); padding:8px 14px; width:260px; transition:border-color var(--transition); }
.search-box:focus-within{ border-color:var(--teal); }
.search-box input{ border:none; background:none; outline:none; font-size:13.5px; width:100%; }
.search-box .icon{ color:var(--text-faint); }
@media (max-width:1100px){ .search-box{ width:180px; } }
.theme-toggle{ width:38px; height:38px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; background:var(--paper-raised); transition:transform var(--transition); }
.theme-toggle:hover{ transform:rotate(20deg); }
.bell-wrap{ position:relative; }
.bell-dot{ position:absolute; top:8px; right:8px; width:7px; height:7px; border-radius:50%; background:var(--rose); border:2px solid var(--paper-raised); }
.profile-chip{ display:flex; align-items:center; gap:9px; padding:6px 12px 6px 6px; border-radius:var(--radius-pill); border:1px solid var(--line); background:var(--paper-raised); }
.avatar{ width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:12px; color:#fff; flex:none; }
.profile-chip .who{ line-height:1.25; }
.profile-chip .who b{ display:block; font-size:12.5px; }
.profile-chip .who span{ display:block; font-size:10.5px; color:var(--text-faint); }
@media (max-width:640px){ .profile-chip .who, .search-box{ display:none; } }

.main-content{ flex:1; padding:26px 28px 60px; max-width:1520px; width:100%; }
.page{ display:none; animation:pageIn .4s cubic-bezier(.22,1,.36,1); }
.page.active{ display:block; }
@keyframes pageIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
.page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
.page-head p.desc{ color:var(--text-soft); font-size:13.5px; margin-top:4px; max-width:560px; }
.page-actions{ display:flex; gap:10px; flex-wrap:wrap; }
.back-link{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--text-soft); margin-bottom:14px; }
.back-link:hover{ color:var(--teal-dark); }

/* ============================================================
   2. KPI CARDS
============================================================ */
.kpi-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:22px; }
.kpi-card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-md); padding:20px; transition:transform var(--transition), box-shadow var(--transition); position:relative; overflow:hidden; }
.kpi-card:hover{ transform:translateY(-4px); box-shadow:var(--shadow-md); }
.kpi-top{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:14px; }
.kpi-ic{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex:none; }
.kpi-trend{ display:flex; align-items:center; gap:4px; font-family:var(--font-mono); font-size:11px; font-weight:600; padding:3px 8px; border-radius:var(--radius-pill); }
.kpi-trend.up{ color:var(--teal-dark); background:rgba(31,158,147,0.12); }
.kpi-trend.down{ color:var(--rose-dark); background:rgba(228,87,61,0.12); }
[data-theme="dark"] .kpi-trend.up{ color:var(--teal); }
[data-theme="dark"] .kpi-trend.down{ color:var(--rose); }
.kpi-value{ font-family:var(--font-display); font-size:29px; font-weight:700; letter-spacing:-0.01em; line-height:1; margin-bottom:6px; }
.kpi-label{ font-size:12.5px; color:var(--text-soft); margin-bottom:12px; }
.kpi-spark{ width:100%; height:30px; display:block; }
@media (max-width:1300px){ .kpi-grid{ grid-template-columns:repeat(3,1fr); } }
@media (max-width:900px){ .kpi-grid{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:540px){ .kpi-grid{ grid-template-columns:1fr; } }

/* ============================================================
   2b. PLATFORM OVERVIEW — card-free infographic canvas
   (diversified infographic set — no two styles repeat within a
   row or between vertically adjacent rows; 4 per row)
============================================================ */
.ov-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:40px 22px; margin-bottom:22px; }
.ov-item{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px; opacity:0; animation:ovFadeUp 0.65s cubic-bezier(.22,1,.36,1) forwards; animation-delay:calc(var(--ov-i, 0) * 55ms); }
.ov-item:nth-child(1){ --ov-i:1; } .ov-item:nth-child(2){ --ov-i:2; } .ov-item:nth-child(3){ --ov-i:3; } .ov-item:nth-child(4){ --ov-i:4; }
.ov-item:nth-child(5){ --ov-i:5; } .ov-item:nth-child(6){ --ov-i:6; } .ov-item:nth-child(7){ --ov-i:7; } .ov-item:nth-child(8){ --ov-i:8; }
.ov-item:nth-child(9){ --ov-i:9; } .ov-item:nth-child(10){ --ov-i:10; } .ov-item:nth-child(11){ --ov-i:11; } .ov-item:nth-child(12){ --ov-i:12; }
.ov-item:nth-child(13){ --ov-i:13; } .ov-item:nth-child(14){ --ov-i:14; }
@keyframes ovFadeUp{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:translateY(0); } }
.ov-visual{ position:relative; width:136px; height:136px; flex:none; transition:transform var(--transition), filter var(--transition); }
.ov-visual svg{ display:block; width:100%; height:100%; overflow:visible; }
.ov-item:hover .ov-visual{ transform:translateY(-4px); filter:drop-shadow(0 10px 18px rgba(18,32,59,0.12)); }
[data-theme="dark"] .ov-item:hover .ov-visual{ filter:drop-shadow(0 10px 18px rgba(0,0,0,0.45)); }
.ov-overlay{ position:absolute; left:0; right:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; pointer-events:none; }
.ov-visual.ov-center .ov-overlay{ inset:0; }
.ov-visual.ov-dome .ov-overlay{ top:auto; bottom:6px; }
.ov-visual.ov-top .ov-overlay{ top:4px; bottom:auto; }
.ov-visual.ov-corner .ov-overlay{ inset:6px 4px auto auto; align-items:flex-end; justify-content:flex-start; gap:2px; }
.ov-ic{ width:19px; height:19px; opacity:0.85; }
.ov-value{ font-family:var(--font-display); font-size:18px; font-weight:700; letter-spacing:-0.01em; color:var(--text); line-height:1; }
.ov-visual.ov-corner .ov-ic{ width:14px; height:14px; }
.ov-visual.ov-corner .ov-value{ font-size:14.5px; }
.ov-arc{ animation:ovDraw 1.1s cubic-bezier(.22,1,.36,1) forwards; animation-delay:calc(var(--ov-i, 0) * 55ms); }
@keyframes ovDraw{ from{ stroke-dashoffset:var(--ov-dash, 0); } to{ stroke-dashoffset:var(--ov-off, 0); } }
.ov-grow-y{ transform:scaleY(0); transform-box:fill-box; transform-origin:bottom; animation:ovGrowY 0.8s cubic-bezier(.22,1,.36,1) forwards; animation-delay:calc(var(--ov-i, 0) * 55ms + 120ms); }
@keyframes ovGrowY{ to{ transform:scaleY(1); } }
.ov-grow-x{ transform:scaleX(0); transform-box:fill-box; transform-origin:left; animation:ovGrowX 0.8s cubic-bezier(.22,1,.36,1) forwards; animation-delay:calc(var(--ov-i, 0) * 55ms + 120ms); }
@keyframes ovGrowX{ to{ transform:scaleX(1); } }
.ov-pop{ opacity:0; transform:scale(0.4); transform-box:fill-box; transform-origin:center; animation:ovPop 0.6s cubic-bezier(.22,1,.36,1) forwards; }
@keyframes ovPop{ to{ opacity:1; transform:scale(1); } }
.ov-fade{ opacity:0; animation:ovFade 0.8s ease forwards; animation-delay:calc(var(--ov-i, 0) * 55ms); }
@keyframes ovFade{ to{ opacity:1; } }
.ov-needle{ transform-origin:68px 92px; opacity:0; animation:ovNeedle 0.9s cubic-bezier(.22,1,.36,1) forwards; animation-delay:calc(var(--ov-i, 0) * 55ms + 150ms); }
@keyframes ovNeedle{ from{ opacity:0; transform:rotate(-35deg); } to{ opacity:1; transform:rotate(0deg); } }
.ov-meta{ display:flex; flex-direction:column; align-items:center; gap:6px; }
.ov-label{ font-size:12.5px; color:var(--text-soft); font-weight:600; max-width:150px; line-height:1.3; }
.ov-trend{ display:inline-flex; align-items:center; gap:4px; font-family:var(--font-mono); font-size:11px; font-weight:600; padding:3px 9px; border-radius:var(--radius-pill); }
.ov-trend.up{ color:var(--teal-dark); background:rgba(31,158,147,0.12); }
.ov-trend.down{ color:var(--rose-dark); background:rgba(228,87,61,0.12); }
[data-theme="dark"] .ov-trend.up{ color:var(--teal); }
[data-theme="dark"] .ov-trend.down{ color:var(--rose); }
@media (max-width:1300px){ .ov-grid{ grid-template-columns:repeat(2,1fr); gap:34px 18px; } }
@media (max-width:540px){ .ov-grid{ grid-template-columns:1fr; } }

/* ============================================================
   3. PANELS — "OS window" chrome motif, reused from the
   marketing site's hero-window as the signature dashboard frame
============================================================ */
.grid-2{ display:grid; grid-template-columns:1.3fr 1fr; gap:18px; }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
@media (max-width:1100px){ .grid-2, .grid-3{ grid-template-columns:1fr; } }

.panel{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden; margin-bottom:18px; box-shadow:var(--shadow-sm); }
.panel-bar{ display:flex; align-items:center; gap:8px; padding:13px 18px; background:var(--paper-sunk); border-bottom:1px solid var(--line); }
.panel-dot{ width:10px; height:10px; border-radius:50%; }
.pd-1{ background:#EF6A5F; } .pd-2{ background:#F2B640; } .pd-3{ background:#63C554; }
.panel-title{ margin-left:8px; font-family:var(--font-mono); font-size:12px; color:var(--text-soft); font-weight:600; letter-spacing:.02em; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.panel-bar-actions{ display:flex; align-items:center; gap:8px; flex:none; }
.panel-body{ padding:20px; }
.panel-body.pad-0{ padding:0; }
.panel-foot{ padding:12px 20px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }

.chip-select{ display:flex; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-pill); padding:3px; gap:2px; }
.chip-select button{ padding:5px 12px; font-size:11.5px; font-weight:600; border-radius:var(--radius-pill); color:var(--text-soft); }
.chip-select button.active{ background:var(--ink); color:var(--paper); }

/* legend */
.legend{ display:flex; flex-direction:column; gap:10px; }
.legend-row{ display:flex; align-items:center; gap:9px; font-size:13px; }
.legend-dot{ width:9px; height:9px; border-radius:3px; flex:none; }
.legend-row .lg-label{ flex:1; color:var(--text-soft); }
.legend-row .lg-val{ font-family:var(--font-mono); font-weight:700; font-size:12.5px; }

/* ============================================================
   4. LEADERBOARD / RANKING
============================================================ */
.rank-row{ display:flex; align-items:center; gap:13px; padding:12px 0; border-bottom:1px solid var(--line); }
.rank-row:last-child{ border-bottom:none; }
.rank-medal{ width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:12.5px; flex:none; color:#fff; background:var(--text-faint); }
.rank-medal.m1{ background:linear-gradient(135deg,#F2C94C,#C9860F); color:#3A2400; }
.rank-medal.m2{ background:linear-gradient(135deg,#D7DCE5,#9096A5); color:#232733; }
.rank-medal.m3{ background:linear-gradient(135deg,#E3A574,#B8402A); color:#2B1200; }
.rank-name{ flex:1; min-width:0; }
.rank-name b{ display:block; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rank-name span{ font-size:11.5px; color:var(--text-faint); }
.rank-bar-track{ flex:1; height:6px; background:var(--paper-sunk); border-radius:6px; overflow:hidden; max-width:140px; }
.rank-bar-fill{ height:100%; border-radius:6px; background:linear-gradient(90deg,var(--teal),var(--teal-dark)); }
.rank-score{ font-family:var(--font-mono); font-weight:700; font-size:13px; width:40px; text-align:right; flex:none; }
@media (max-width:700px){ .rank-bar-track{ display:none; } }

/* ============================================================
   5. TABLES
============================================================ */
.table-wrap{ overflow-x:auto; }
table.data-table{ width:100%; border-collapse:collapse; font-size:13.5px; min-width:640px; }
.data-table thead th{ text-align:left; font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); font-weight:600; padding:10px 16px; background:var(--paper-sunk); white-space:nowrap; }
.data-table thead th:first-child{ border-radius:0; }
.data-table tbody td{ padding:13px 16px; border-bottom:1px solid var(--line); vertical-align:middle; }
.data-table tbody tr{ transition:background var(--transition); }
.data-table tbody tr:hover{ background:var(--paper-sunk); }
.data-table tbody tr:last-child td{ border-bottom:none; }
.row-title{ font-weight:600; }
.row-sub{ font-size:11.5px; color:var(--text-faint); margin-top:2px; }
.row-clickable{ cursor:pointer; }
.td-actions{ display:flex; gap:6px; flex-wrap:wrap; }
.mono{ font-family:var(--font-mono); font-size:12px; color:var(--text-soft); }

/* status chips */
.chip{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:var(--radius-pill); white-space:nowrap; }
.chip::before{ content:''; width:6px; height:6px; border-radius:50%; }
.chip-ready{ background:rgba(31,158,147,0.13); color:var(--teal-dark); } .chip-ready::before{ background:var(--teal); }
.chip-warn{ background:rgba(242,169,59,0.16); color:var(--amber-dark); } .chip-warn::before{ background:var(--amber); }
.chip-risk{ background:rgba(228,87,61,0.13); color:var(--rose-dark); } .chip-risk::before{ background:var(--rose); }
.chip-neutral{ background:var(--paper-sunk); color:var(--text-soft); } .chip-neutral::before{ background:var(--text-faint); }
.chip-scheduled{ background:rgba(51,67,106,0.13); color:#33436A; } .chip-scheduled::before{ background:#33436A; }
.chip-completed{ background:rgba(75,85,99,0.16); color:#4B5563; } .chip-completed::before{ background:#4B5563; }
.chip-archived{ background:rgba(124,58,237,0.13); color:#7C3AED; } .chip-archived::before{ background:#7C3AED; }
[data-theme="dark"] .chip-scheduled{ color:#7C90C4; } [data-theme="dark"] .chip-completed{ color:#9CA3AF; } [data-theme="dark"] .chip-archived{ color:#B794F6; }
[data-theme="dark"] .chip-ready{ color:var(--teal); } [data-theme="dark"] .chip-warn{ color:var(--amber); } [data-theme="dark"] .chip-risk{ color:var(--rose); }

/* ============================================================
   6. TABS
============================================================ */
.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px; overflow-x:auto; }
.tab-btn{ padding:11px 16px; font-size:13.5px; font-weight:600; color:var(--text-soft); border-bottom:2px solid transparent; white-space:nowrap; }
.tab-btn:hover{ color:var(--text); }
.tab-btn.active{ color:var(--ink); border-bottom-color:var(--amber-dark); }
[data-theme="dark"] .tab-btn.active{ color:#fff; border-bottom-color:var(--amber); }

/* ============================================================
   7. TOOLBAR / FILTERS
============================================================ */
.toolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
.toolbar .search-box{ width:280px; }
.select-field, .text-field{ padding:9px 14px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--paper-raised); font-size:13px; }
.select-field:focus, .text-field:focus{ outline:none; border-color:var(--teal); }
.spacer{ flex:1; }

/* ============================================================
   8. CARDS GRID (colleges)
============================================================ */
.card-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
.entity-card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-md); padding:18px; transition:transform var(--transition), box-shadow var(--transition); cursor:pointer; }
.entity-card:hover{ transform:translateY(-4px); box-shadow:var(--shadow-md); }
.entity-card-top{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.entity-logo{ width:44px; height:44px; border-radius:12px; background:linear-gradient(135deg,var(--teal),var(--ink)); display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-mono); font-weight:700; font-size:14px; flex:none; }
.entity-card-top h4{ font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.entity-card-top p{ font-size:11.5px; color:var(--text-faint); }
.entity-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0; }
.entity-stat b{ display:block; font-family:var(--font-mono); font-size:15px; }
.entity-stat span{ font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em; }
.entity-card-foot{ display:flex; align-items:center; justify-content:space-between; padding-top:12px; border-top:1px solid var(--line); }

/* ============================================================
   9. PROGRESS / STAT BLOCKS
============================================================ */
.progress-track{ width:100%; height:8px; border-radius:6px; background:var(--paper-sunk); overflow:hidden; }
.progress-fill{ height:100%; border-radius:6px; }
.stat-block-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:16px; }
.stat-block{ background:var(--paper-sunk); border-radius:var(--radius-sm); padding:14px 16px; }
.stat-block b{ display:block; font-family:var(--font-display); font-size:22px; }
.stat-block span{ font-size:11.5px; color:var(--text-soft); }

/* ============================================================
   10. MODAL + TOAST
============================================================ */
.modal-overlay{ position:fixed; inset:0; background:rgba(18,32,59,0.55); backdrop-filter:blur(3px); z-index:900; display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn .25s var(--transition); }
@keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
.modal-box{ background:var(--paper-raised); border-radius:var(--radius-md); max-width:440px; width:100%; box-shadow:var(--shadow-lg); overflow:hidden; animation:modalIn .3s cubic-bezier(.22,1,.36,1); border:1px solid var(--line); }
@keyframes modalIn{ from{ opacity:0; transform:translateY(16px) scale(.97); } to{ opacity:1; transform:translateY(0) scale(1); } }
.modal-icon{ width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:24px 24px 0; }
.modal-body{ padding:14px 24px 24px; }
.modal-body h3{ font-size:17px; margin-bottom:8px; }
.modal-body p{ font-size:13.5px; color:var(--text-soft); line-height:1.6; }
.modal-actions{ display:flex; gap:10px; margin-top:20px; }
.modal-actions .btn{ flex:1; justify-content:center; }
.modal-input{ margin-top:16px; }
.modal-input label{ font-size:12px; font-weight:600; display:block; margin-bottom:6px; }

.form-panel{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
.form-group label{ display:block; font-size:12px; font-weight:600; margin-bottom:6px; color:var(--text-soft); }
.form-group input, .form-group select, .form-group textarea{ width:100%; padding:10px 13px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--paper); font-size:13.5px; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus{ outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(31,158,147,0.14); }
.form-group.full{ grid-column:1/-1; }
@media (max-width:640px){ .form-panel{ grid-template-columns:1fr; } }

.toast-container{ position:fixed; bottom:22px; right:22px; z-index:1000; display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
.toast{ background:var(--ink); color:#EEF0F6; padding:13px 18px; border-radius:12px; font-size:13.5px; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow-lg); animation:toastIn .35s cubic-bezier(.22,1,.36,1); max-width:320px; }
@keyframes toastIn{ from{ opacity:0; transform:translateY(10px) scale(.96); } to{ opacity:1; transform:translateY(0) scale(1); } }
.toast .icon{ color:var(--teal); flex:none; }
.toast.danger .icon{ color:var(--rose); }

.empty-state{ text-align:center; padding:50px 20px; color:var(--text-faint); }
.empty-state .e-ic{ font-size:36px; margin-bottom:12px; }
.empty-state .icon-lg{ width:38px; height:38px; margin:0 auto 12px; color:var(--text-faint); }

/* audit log timeline dot */
.audit-action{ display:flex; align-items:center; gap:8px; }
.audit-dot{ width:8px; height:8px; border-radius:50%; flex:none; }

/* toggle switch */
.switch{ position:relative; width:38px; height:22px; border-radius:20px; background:var(--paper-sunk); border:1px solid var(--line); flex:none; }
.switch::after{ content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--text-faint); transition:transform var(--transition), background var(--transition); }
.switch.on{ background:rgba(31,158,147,0.25); border-color:var(--teal); }
.switch.on::after{ transform:translateX(16px); background:var(--teal-dark); }

/* mobile sidebar */
@media (max-width:960px){
  .sidebar{ position:fixed; left:0; top:0; transform:translateX(-100%); box-shadow:var(--shadow-lg); }
  .sidebar.mobile-open{ transform:translateX(0); }
  .sidebar.collapsed{ width:var(--sidebar-w); }
  .sidebar.collapsed .brand-text, .sidebar.collapsed .side-link .label, .sidebar.collapsed .side-link .count, .sidebar.collapsed .side-section-label, .sidebar.collapsed .sidebar-collapse-btn .label{ display:block; opacity:1; height:auto; }
  .mobile-menu-btn{ display:flex; }
  .sidebar-backdrop{ display:none; position:fixed; inset:0; background:rgba(18,32,59,0.5); z-index:190; }
  .sidebar-backdrop.show{ display:block; }
  .main-content{ padding:20px 16px 50px; }
  .kpi-grid{ grid-template-columns:repeat(2,1fr); }
  .ov-grid{ grid-template-columns:repeat(2,1fr); }
}

/* ============================================================
   11. DASHBOARD 3.0 — soft/light hero, flat stat strip, and a
   "clean card" system (title + quiet ⋯ menu, no OS-window
   chrome) so the dashboard reads calmer and less code-editor-y,
   closer to the platform's product reference. Only used on the
   Dashboard page — every other page keeps its .panel chrome.
============================================================ */
.hero-banner{ display:grid; grid-template-columns:1.35fr 1fr; align-items:stretch; background:linear-gradient(120deg, var(--paper-sunk) 0%, #FBEEDA 55%, #F7E2C1 100%); border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-sm); margin-bottom:20px; border:1px solid var(--line); position:relative; }
[data-theme="dark"] .hero-banner{ background:linear-gradient(120deg, var(--paper-sunk) 0%, #1B2338 60%, #26241A 130%); }
.hero-banner-copy{ padding:32px 38px; position:relative; z-index:1; display:flex; flex-direction:column; justify-content:center; gap:10px; }
.hero-kicker{ font-family:var(--font-display); font-size:24px; font-weight:700; color:var(--ink); }
.hero-banner-copy .hero-sub{ color:var(--text-soft); font-size:13.5px; font-weight:500; margin-top:-6px; }
.hero-banner-copy p{ color:var(--text-soft); font-size:13.5px; max-width:440px; line-height:1.6; display:none; }
.hero-banner-actions{ display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }
.hero-banner-media{ position:relative; min-height:220px; }
.hero-banner-media img{ width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
@media (max-width:1000px){ .hero-banner{ grid-template-columns:1fr; } .hero-banner-media{ min-height:160px; } }

/* flat stat strip (sits on the page background, not inside a card) */
.stat-strip{ display:flex; flex-wrap:wrap; gap:0; margin:20px 0 24px; }
.stat-strip-item{ flex:1; min-width:170px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:4px 22px; border-right:1px solid var(--line); }
.stat-strip-item:first-child{ padding-left:2px; }
.stat-strip-item:last-child{ border-right:none; }
.ssi-text span{ display:block; font-size:12.5px; color:var(--text-soft); margin-bottom:4px; }
.ssi-text b{ font-family:var(--font-display); font-size:25px; font-weight:700; color:var(--text); line-height:1; }
.ssi-ic{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex:none; }
@media (max-width:900px){ .stat-strip-item{ min-width:44%; border-right:none; border-bottom:1px solid var(--line); padding:12px 2px; } }

/* clean card — title + quiet menu, no dots/filename chrome */
.card-clean{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); overflow:hidden; margin-bottom:18px; transition:box-shadow var(--transition); }
.card-clean:hover{ box-shadow:var(--shadow-md); }
.card-clean-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:19px 20px 2px; }
.card-clean-head h4{ font-family:var(--font-display); font-size:15.5px; font-weight:600; }
.card-clean-menu-btn{ width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--text-faint); flex:none; transition:background var(--transition); }
.card-clean-menu-btn:hover{ background:var(--paper-sunk); color:var(--text-soft); }
.card-clean-select{ font-size:12px; font-weight:600; padding:6px 12px; border-radius:var(--radius-pill); border:1px solid var(--line); background:var(--paper); color:var(--text-soft); }
.card-clean-body{ padding:16px 20px 20px; }
.card-clean-body.pad-0{ padding:0; }

.dash-row{ display:grid; grid-template-columns:1.6fr 1fr; gap:18px; align-items:start; }
@media (max-width:1100px){ .dash-row{ grid-template-columns:1fr; } }
.dash-col-main{ min-width:0; }
.dash-col-side{ display:flex; flex-direction:column; gap:18px; min-width:0; }
.dash-col-side .card-clean{ margin-bottom:0; }

/* photo-backed analytics panel (dark, image + bar overlay) */
.photo-panel{ position:relative; border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-sm); min-height:280px; display:flex; flex-direction:column; justify-content:flex-end; border:1px solid var(--line); margin-bottom:18px; }
.photo-panel img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.photo-panel .pp-scrim{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(11,16,28,0.1) 0%, rgba(11,16,28,0.55) 45%, rgba(11,16,28,0.92) 100%); }
.photo-panel .pp-head{ position:relative; z-index:1; padding:18px 20px 0; color:#fff; font-weight:600; font-size:14.5px; font-family:var(--font-display); display:flex; align-items:center; justify-content:space-between; }
.photo-panel .pp-head .card-clean-menu-btn{ color:rgba(255,255,255,0.7); }
.photo-panel .pp-head .card-clean-menu-btn:hover{ background:rgba(255,255,255,0.12); color:#fff; }
.photo-panel .pp-bars{ position:relative; z-index:1; display:flex; align-items:flex-end; gap:10px; padding:18px; height:150px; }
.pp-bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px; }
.pp-bar-val{ font-family:var(--font-mono); font-size:10.5px; color:#fff; font-weight:700; }
.pp-bar-shape{ width:100%; max-width:26px; border-radius:6px 6px 3px 3px; background:linear-gradient(180deg,var(--amber),var(--amber-dark)); box-shadow:0 4px 14px rgba(242,169,59,0.35); }
.pp-bar-label{ font-size:9.5px; color:rgba(237,235,227,0.75); text-align:center; line-height:1.2; }

/* activity feed */
.activity-feed{ display:flex; flex-direction:column; gap:4px; }
.activity-item{ display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
.activity-item:last-child{ border-bottom:none; }
.activity-thumb{ width:38px; height:38px; border-radius:11px; object-fit:cover; flex:none; }
.activity-ic{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex:none; }
.activity-body{ min-width:0; flex:1; }
.activity-body b{ display:block; font-size:13px; font-weight:600; }
.activity-body p{ font-size:12px; color:var(--text-soft); margin-top:2px; line-height:1.4; }
.activity-body time{ font-size:10.5px; color:var(--text-faint); font-family:var(--font-mono); margin-top:4px; display:block; }

/* action required / notice list */
.notice-list{ display:flex; flex-direction:column; gap:10px; }
.notice-item{ display:flex; gap:12px; padding:12px 14px; border-radius:var(--radius-sm); background:var(--paper-sunk); border-left:3px solid var(--amber-dark); }
.notice-item.rose{ border-left-color:var(--rose-dark); }
.notice-item.teal{ border-left-color:var(--teal-dark); }
.notice-item b{ display:block; font-size:12.5px; font-weight:700; }
.notice-item p{ font-size:11.5px; color:var(--text-soft); margin-top:2px; }
.notice-item time{ font-size:10px; color:var(--text-faint); font-family:var(--font-mono); margin-top:4px; display:block; }

/* announcements */
.announce-item{ display:flex; align-items:flex-start; gap:10px; padding:11px 0; border-bottom:1px dashed var(--line); }
.announce-item:last-child{ border-bottom:none; }
.announce-dot{ width:7px; height:7px; border-radius:50%; margin-top:6px; flex:none; }

/* mini side photo card */
.side-photo-card{ position:relative; border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-sm); border:1px solid var(--line); min-height:150px; }
.side-photo-card img{ width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
.side-photo-card .spc-scrim{ position:absolute; inset:0; background:linear-gradient(180deg, transparent 40%, rgba(11,16,28,0.85) 100%); }
.side-photo-card .spc-text{ position:absolute; left:0; right:0; bottom:0; z-index:1; padding:14px 16px; color:#fff; }
.side-photo-card .spc-text b{ display:block; font-size:13px; font-family:var(--font-display); }
.side-photo-card .spc-text span{ font-size:11px; color:rgba(237,235,227,0.78); }

/* quick actions — flat inline row, no card chrome, matches product reference */
.quick-flat-row{ display:flex; align-items:center; gap:30px; flex-wrap:wrap; padding:4px 2px 6px; }
.quick-flat-item{ display:flex; align-items:center; gap:9px; font-size:13px; font-weight:600; color:var(--text); transition:color var(--transition), transform var(--transition); }
.quick-flat-item:hover{ color:var(--teal-dark); transform:translateY(-1px); }
[data-theme="dark"] .quick-flat-item:hover{ color:var(--teal); }
.qf-ic{ width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex:none; }

/* section heading with "view all" */
.section-head{ display:flex; align-items:center; justify-content:space-between; margin:26px 0 14px; }
.section-head h3{ font-size:16px; }
.section-head a{ font-size:12px; font-weight:600; color:var(--teal-dark); display:inline-flex; align-items:center; gap:4px; }
[data-theme="dark"] .section-head a{ color:var(--teal); }
/* ============================================================
   NEW: big-form modal system (sa- prefix keeps it isolated from
   the existing lightweight confirm modal) — used by Create Quiz,
   Schedule Session, Manage Colleges, Verify Level.
============================================================ */
.sa-modal-overlay{ position:fixed; inset:0; background:rgba(18,32,59,0.55); backdrop-filter:blur(3px); z-index:950; display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn .25s var(--transition); }
.sa-modal{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-md); width:100%; max-width:560px; max-height:88vh; display:flex; flex-direction:column; box-shadow:var(--shadow-lg); animation:modalIn .3s cubic-bezier(.22,1,.36,1); }
.sa-modal.sa-modal-lg{ max-width:720px; }
.sa-modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line); flex:none; }
.sa-modal-head h3{ font-size:17px; }
.sa-modal-close{ width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); background:var(--paper); flex:none; }
.sa-modal-close:hover{ border-color:var(--ink-soft); }
.sa-modal-body{ padding:20px 22px; overflow-y:auto; flex:1; }
.sa-modal-foot{ padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; flex:none; flex-wrap:wrap; }
.sa-field{ margin-bottom:14px; }
.sa-field label{ display:block; font-size:12px; font-weight:600; margin-bottom:6px; color:var(--text-soft); }
.sa-field input, .sa-field select, .sa-field textarea{ width:100%; padding:10px 13px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--paper); font-size:13.5px; color:var(--text); font-family:inherit; }
.sa-field textarea{ min-height:74px; resize:vertical; }
.sa-field input:focus, .sa-field select:focus, .sa-field textarea:focus{ outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(31,158,147,0.14); }
.sa-row-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.sa-row-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
@media (max-width:560px){ .sa-row-2, .sa-row-3{ grid-template-columns:1fr; } }
.sa-stepper{ display:flex; align-items:center; margin-bottom:20px; }
.sa-step{ display:flex; align-items:center; gap:8px; }
.sa-step-num{ width:26px; height:26px; border-radius:50%; background:var(--paper-sunk); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--text-soft); flex:none; }
.sa-step.active .sa-step-num{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.sa-step.done .sa-step-num{ background:var(--teal); color:#fff; border-color:var(--teal); }
.sa-step-label{ font-size:12.5px; font-weight:600; color:var(--text-soft); }
.sa-step.active .sa-step-label{ color:var(--text); }
.sa-step-line{ flex:1; height:1px; background:var(--line); margin:0 10px; }
.sa-section-count-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius-sm); margin-bottom:10px; }
.sa-section-count-row .sc-label{ font-size:13.5px; font-weight:600; }
.sa-stepper-input{ display:flex; align-items:center; border:1px solid var(--line); border-radius:var(--radius-pill); overflow:hidden; }
.sa-stepper-input button{ width:28px; height:28px; font-size:15px; color:var(--text-soft); }
.sa-stepper-input button:hover{ background:var(--paper); color:var(--text); }
.sa-stepper-input input{ width:44px; text-align:center; border:none; background:none; font-size:13px; font-family:var(--font-mono); }
.sa-total-q-banner{ display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:var(--paper-sunk); border-radius:var(--radius-sm); font-weight:700; margin-top:6px; }
.sa-dropzone{ border:1.5px dashed var(--line); border-radius:var(--radius-md); padding:26px 16px; text-align:center; cursor:pointer; transition:border-color var(--transition), background var(--transition); }
.sa-dropzone:hover, .sa-dropzone.dragover{ border-color:var(--teal); background:rgba(31,158,147,0.06); }
.sa-checkbox-wrap{ display:inline-flex; align-items:center; gap:6px; font-size:13px; margin-right:14px; }
.sa-att-btn{ border:1px solid var(--line); background:var(--paper-raised); }
.sa-att-btn.on[data-state="present"]{ background:var(--teal); color:#fff; border-color:var(--teal); }
.sa-att-btn.on[data-state="absent"]{ background:var(--rose); color:#fff; border-color:var(--rose); }
.sa-att-btn.on[data-state="late"]{ background:var(--amber); color:#1B1300; border-color:var(--amber); }
.sa-college-check-list{ display:flex; flex-direction:column; gap:10px; max-height:280px; overflow-y:auto; }
.sa-college-check-row{ display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-sm); }
.sa-college-check-row input{ width:16px; height:16px; }

/* ---- Accessibility: focus trap ring + mobile sidebar polish ---- */
.sidebar:focus-visible, .sa-modal:focus-visible{ outline:none; }
.sidebar a.side-link:focus-visible{ outline:2px solid var(--teal); outline-offset:-2px; }
@media (max-width:960px){
  .sidebar{ position:fixed; transform:translateX(-100%); }
  .sidebar.mobile-open{ transform:translateX(0); }
}
.sidebar-mobile-close{ display:none; }
@media (max-width:960px){
  .sidebar-mobile-close{ display:flex; width:32px; height:32px; border-radius:50%; align-items:center; justify-content:center; border:1px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.06); color:#fff; margin-left:auto; }
}

/* ---- Narrow phones: tighten spacing on top of the breakpoints above, no visual redesign ---- */
@media (max-width:480px){
  .topbar{ padding:0 14px; gap:8px; }
  .main-content{ padding:16px 12px 40px; }
  .hero-banner-copy{ padding:20px 18px; }
  .stat-strip-item{ min-width:100%; }
  .quick-flat-row{ gap:16px; }
  .modal-overlay{ padding:12px; }
  .modal-box{ max-width:100%; }
  .page-head{ align-items:flex-start; }
  .toolbar .search-box{ width:100%; }
}
/* ============================================================
   CREATE QUIZ WIZARD — ported verbatim from trainer.html's
   Assessment Management > Create Quiz module. The outer modal
   shell classes are prefixed "qzw-" (Quiz Wizard) because
   superadmin.html already defines .modal-overlay/.modal-body
   for its lightweight confirm modal — everything else below
   (stepper, fields, multiselect, radio cards, question pager,
   dropzone, validation summary, review grid) is copied with its
   original trainer.html class names since none of them collide.
============================================================ */
.qzw-overlay{ position:fixed; inset:0; background:rgba(15,23,42,0.5); backdrop-filter:blur(4px); z-index:1000; display:flex; align-items:center; justify-content:center; padding:24px; animation: fade-in 0.3s ease; }
.qzw-modal{ background:var(--paper-raised); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); width:100%; max-width:640px; max-height:88vh; overflow-y:auto; animation: panel-in 0.4s cubic-bezier(.22,1,.36,1); border:1px solid var(--line); }
.qzw-modal.qzw-modal-xl{ max-width:980px; }
.qzw-modal-head{ display:flex; align-items:center; justify-content:space-between; padding:22px 26px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--paper-raised); z-index:2; }
.qzw-modal-head h3{ font-size:19px; }
.qzw-modal-close{ width:32px; height:32px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; background:var(--paper-raised); }
.qzw-modal-close:hover{ background:var(--paper); }
.qzw-modal-body{ padding:24px 26px; }
.qzw-modal-foot{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 26px; border-top:1px solid var(--line); position:sticky; bottom:0; background:var(--paper-raised); }
@keyframes fade-in{ from{ opacity:0; } to{ opacity:1; } }
@keyframes panel-in{ from{ opacity:0; transform:translateY(14px) scale(0.98); } to{ opacity:1; transform:translateY(0) scale(1); } }

/* ---- Stepper ---- */
.stepper{ display:flex; align-items:center; gap:8px; margin-bottom:24px; }
.step{ flex:1; display:flex; align-items:center; gap:10px; }
.step-num{ width:26px; height:26px; border-radius:50%; background:var(--line); color:var(--text-soft); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0; transition:all var(--transition); }
.step.active .step-num, .step.done .step-num{ background:var(--teal); color:#fff; }
.step-label{ font-size:12px; color:var(--text-soft); font-weight:600; }
.step.active .step-label{ color:var(--text); }
.step-line{ flex:1; height:2px; background:var(--line); }

/* ---- Form fields (ported wrapper, since superadmin's .field is undefined and .select-field means something else) ---- */
.field{ position:relative; margin-bottom:18px; }
.field label{ position:absolute; left:14px; top:13px; font-size:13.5px; color:var(--text-soft); pointer-events:none; transition: all var(--transition); background:transparent; padding:0 4px; }
.field input,.field select,.field textarea{ width:100%; padding:15px 14px 5px; font-size:14px; color:var(--text); background:var(--paper-raised); border:1.5px solid var(--line); border-radius:var(--radius-sm); transition: border-color var(--transition), box-shadow var(--transition); appearance:none; -webkit-appearance:none; }
.field textarea{ padding-top:15px; min-height:80px; resize:vertical; }
.field input::placeholder{ color:transparent; }
.field input:focus,.field select:focus,.field textarea:focus{ outline:none; border-color:var(--teal); box-shadow:0 0 0 4px rgba(251,146,60,0.14); }
.field input:focus + label,.field input:not(:placeholder-shown) + label,.field.has-value label,.field select + label,.field textarea:focus + label,.field textarea:not(:placeholder-shown) + label{ top:5px; font-size:10.5px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase; color:var(--teal-dark); }
[data-theme="dark"] .field input:focus + label,[data-theme="dark"] .field select + label,[data-theme="dark"] .field textarea:focus + label{ color:var(--teal); }
.field.qzw-select-field label{ position:static; display:block; margin-bottom:7px; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; color:var(--text-soft); }
.field.qzw-select-field select{ padding:13px 14px; }
.row-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.row-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
.row-4{ display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:14px; }
.field-hint{ font-size:11.5px; color:var(--text-soft); margin-top:-12px; margin-bottom:16px; }
.section-title{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-soft); margin:22px 0 10px; display:flex; align-items:center; justify-content:space-between; }
.section-divider{ border-top:1px solid var(--line); margin:20px 0; }

/* ---- Searchable multi-select (Applicable Colleges) ---- */
.ms{ position:relative; margin-bottom:18px; }
.ms-label{ font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; color:var(--text-soft); margin-bottom:7px; display:block; }
.ms-trigger{ width:100%; min-height:48px; padding:9px 14px; border:1.5px solid var(--line); border-radius:var(--radius-sm); background:var(--paper-raised); display:flex; align-items:center; flex-wrap:wrap; gap:6px; cursor:pointer; transition: border-color var(--transition), box-shadow var(--transition); }
.ms-trigger:hover{ border-color:var(--teal); }
.ms-trigger.open{ border-color:var(--teal); box-shadow:0 0 0 4px rgba(251,146,60,0.14); }
.ms-placeholder{ color:var(--text-soft); font-size:13.5px; }
.ms-tag{ display:inline-flex; align-items:center; gap:6px; background:rgba(251,146,60,0.12); color:var(--teal-dark); font-size:12px; font-weight:600; padding:4px 8px 4px 10px; border-radius:100px; }
[data-theme="dark"] .ms-tag{ color:var(--teal); }
.ms-tag .ms-tag-x{ width:15px; height:15px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; background:rgba(15,23,42,0.08); }
.ms-tag .ms-tag-x:hover{ background:rgba(228,87,61,0.25); }
.ms-more{ font-size:12px; color:var(--text-soft); font-weight:600; padding:4px 6px; }
.ms-caret{ margin-left:auto; font-size:11px; color:var(--text-soft); transition:transform var(--transition); flex-shrink:0; }
.ms-trigger.open .ms-caret{ transform:rotate(180deg); }
.ms-panel{ position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-sm); box-shadow:var(--shadow-lg); z-index:50; display:none; overflow:hidden; }
.ms-panel.open{ display:block; animation: fade-in 0.2s ease; }
.ms-search-wrap{ padding:10px; border-bottom:1px solid var(--line); }
.ms-search-wrap input{ width:100%; padding:9px 12px; font-size:13px; border:1.5px solid var(--line); border-radius:var(--radius-sm); background:var(--paper); }
.ms-search-wrap input:focus{ outline:none; border-color:var(--teal); }
.ms-selectall{ display:flex; align-items:center; gap:9px; padding:10px 14px; font-size:13px; font-weight:600; cursor:pointer; border-bottom:1px solid var(--line); color:var(--text); }
.ms-selectall:hover{ background:var(--paper); }
.ms-options{ max-height:220px; overflow-y:auto; padding:6px; }
.ms-option{ display:flex; align-items:center; gap:9px; padding:8px 10px; font-size:13.5px; border-radius:var(--radius-sm); cursor:pointer; }
.ms-option:hover{ background:var(--paper); }
.ms-option input{ width:15px; height:15px; accent-color:var(--teal-dark); cursor:pointer; flex-shrink:0; }
.ms-empty{ padding:18px 14px; text-align:center; font-size:12.5px; color:var(--text-soft); }

/* ---- Radio cards (Quiz Type) ---- */
.radio-cards{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px; }
.radio-card{ border:1.5px solid var(--line); border-radius:var(--radius-sm); padding:14px 16px; cursor:pointer; display:flex; align-items:flex-start; gap:10px; transition: border-color var(--transition), background var(--transition); }
.radio-card:hover{ border-color:var(--teal); }
.radio-card.checked{ border-color:var(--teal); background:rgba(251,146,60,0.06); }
.radio-card input{ margin-top:2px; accent-color:var(--teal-dark); width:15px; height:15px; flex-shrink:0; }
.radio-card .rc-title{ font-size:13.5px; font-weight:600; }
.radio-card .rc-sub{ font-size:11.5px; color:var(--text-soft); margin-top:2px; }

/* ---- Section distribution ---- */
.section-count-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius-sm); margin-bottom:10px; }
.section-count-row .sc-label{ font-size:13.5px; font-weight:600; }
.stepper-input{ display:flex; align-items:center; gap:8px; }
.stepper-input button{ width:26px; height:26px; border-radius:6px; border:1px solid var(--line); }
.stepper-input button:hover{ background:var(--paper); }
.stepper-input input{ width:48px; text-align:center; padding:5px; border:1.5px solid var(--line); border-radius:6px; font-size:13px; }
.total-q-banner{ margin-top:14px; padding:14px 16px; background:rgba(245,158,11,0.1); border:1px dashed var(--amber-dark); border-radius:var(--radius-sm); font-size:13.5px; font-weight:600; display:flex; justify-content:space-between; }

/* ---- Question navigator (manual entry pager) ---- */
.qnav-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px; flex-wrap:wrap; }
.qnav-title{ font-family:var(--font-display); font-size:17px; font-weight:600; }
.qnav-progress{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-soft); }
.qnav-pager{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:20px; max-height:96px; overflow-y:auto; padding:2px; }
.qnav-dot{ width:30px; height:30px; border-radius:8px; border:1.5px solid var(--line); background:var(--paper-raised); font-family:var(--font-mono); font-size:11.5px; font-weight:600; color:var(--text-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition: all var(--transition); }
.qnav-dot:hover{ border-color:var(--teal); }
.qnav-dot.current{ border-color:var(--teal); background:var(--teal); color:#fff; }
.qnav-dot.complete{ border-color:var(--teal-dark); background:rgba(251,146,60,0.14); color:var(--teal-dark); }
[data-theme="dark"] .qnav-dot.complete{ color:var(--teal); }
.qnav-dot.current.complete{ background:var(--teal); color:#fff; }

.answer-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:6px; }
.answer-opt{ display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:var(--radius-sm); padding:4px 4px 4px 14px; }
.answer-opt input[type=checkbox], .answer-opt input[type=radio]{ width:16px; height:16px; accent-color:var(--teal-dark); flex-shrink:0; cursor:pointer; }
.answer-opt .opt-letter{ font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--text-soft); width:16px; flex-shrink:0; }
.answer-opt input[type=text]{ border:none; background:transparent; padding:12px 4px; flex:1; min-width:0; }
.answer-opt input[type=text]:focus{ outline:none; }
.answer-opt.is-correct{ border-color:var(--teal-dark); background:rgba(251,146,60,0.06); }

.q-status-chip{ font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; padding:3px 9px; border-radius:100px; font-weight:700; }
.q-status-chip.incomplete{ background:rgba(228,87,61,0.12); color:var(--rose); }
.q-status-chip.complete{ background:rgba(251,146,60,0.14); color:var(--teal-dark); }
[data-theme="dark"] .q-status-chip.complete{ color:var(--teal); }

/* ---- Bulk upload ---- */
.dropzone{ border:2px dashed var(--line); border-radius:var(--radius-md); padding:36px 20px; text-align:center; cursor:pointer; transition:all var(--transition); background:var(--paper); }
.dropzone:hover, .dropzone.dragover{ border-color:var(--teal); background:rgba(251,146,60,0.06); }
.dropzone .dz-icon{ width:52px; height:52px; border-radius:14px; background:rgba(245,158,11,0.16); color:var(--amber-dark); display:flex; align-items:center; justify-content:center; font-size:22px; margin:0 auto 14px; }
.dropzone .dz-title{ font-weight:600; font-size:14.5px; margin-bottom:4px; }
.dropzone .dz-sub{ font-size:12px; color:var(--text-soft); }
.dropzone input[type=file]{ display:none; }
.upload-meta-row{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:16px; font-size:12.5px; color:var(--text-soft); flex-wrap:wrap; }
.val-summary{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px; }
.val-stat{ padding:14px; border:1px solid var(--line); border-radius:var(--radius-sm); text-align:center; background:var(--paper); }
.val-stat strong{ display:block; font-family:var(--font-display); font-size:22px; }
.val-stat span{ font-size:10.5px; color:var(--text-soft); text-transform:uppercase; letter-spacing:0.04em; font-family:var(--font-mono); }
.val-stat.v-valid strong{ color:var(--teal-dark); } [data-theme="dark"] .val-stat.v-valid strong{ color:var(--teal); }
.val-stat.v-invalid strong{ color:var(--rose); }
.val-stat.v-dup strong{ color:var(--amber-dark); }
.err-table td, .err-table th{ font-size:12.5px; }
.err-table td.err-msg{ color:var(--rose); }
@media (max-width: 640px){ .val-summary{ grid-template-columns:repeat(2,1fr); } }

/* ---- Review step ---- */
.review-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:18px; }
.review-item{ border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px; background:var(--paper); }
.review-item .ri-label{ font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-soft); margin-bottom:4px; }
.review-item .ri-value{ font-size:14px; font-weight:600; }
.review-qcard{ border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:10px; background:var(--paper); }
.review-qcard .rq-num{ font-family:var(--font-mono); font-size:10.5px; color:var(--teal-dark); font-weight:700; margin-bottom:6px; }
[data-theme="dark"] .review-qcard .rq-num{ color:var(--teal); }
.review-qcard ul{ margin-top:8px; }
.review-qcard li{ font-size:12.5px; color:var(--text-soft); padding:3px 0 3px 18px; position:relative; }
.review-qcard li.correct{ color:var(--teal-dark); font-weight:600; }
[data-theme="dark"] .review-qcard li.correct{ color:var(--teal); }
.review-qcard li::before{ content:'—'; position:absolute; left:0; }
.review-qcard li.correct::before{ content:'✓'; }
@media (max-width:640px){ .review-grid{ grid-template-columns:1fr; } }

</style>

const AUTH_API = '/api/auth';

async function authApiGet(path){
  try {
    const res = await fetch(AUTH_API + path, { method:'GET', credentials:'include' });
    const data = await res.json();
    return { ok: res.ok, status: res.status, data };
  } catch (err) {
    return { ok:false, status:0, data:{ message:'Could not reach the server.' } };
  }
}
async function authApiPut(path){
  try {
    const res = await fetch(AUTH_API + path, { method:'PUT', credentials:'include' });
    const data = await res.json();
    return { ok: res.ok, status: res.status, data };
  } catch (err) {
    return { ok:false, status:0, data:{ message:'Could not reach the server.' } };
  }
}

function fmtRegDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

// Pulls all three queues + stats, updates sidebar badges, and re-renders
// the current page if it's one of the approval pages (so Approve/Reject
// and the initial page load both end up showing real data with no manual
// refresh needed).
async function refreshApprovalData(){
  await Promise.all([loadCollegeAdminQueue(), loadTrainerQueue(), loadStudentQueue(), loadApprovalStats()]);
  updateSidebarCounts();
  if(['verification','trainer-verification','student-verification','dashboard'].includes(STATE.page)){
    renderPage();
  }
}
function updateSidebarCounts(){
  const counts = {
    verification: APPROVAL_STATS.pendingCollegeAdmins,
    'trainer-verification': APPROVAL_STATS.pendingTrainers,
    'student-verification': APPROVAL_STATS.pendingStudents,
  };
  Object.keys(counts).forEach(key=>{
    const link = document.querySelector(`.side-link[data-page="${key}"]`);
    if(!link) return;
    let badge = link.querySelector('.count');
    if(counts[key]){
      if(!badge){ badge = document.createElement('span'); badge.className = 'count'; link.appendChild(badge); }
      badge.textContent = counts[key];
    } else if(badge){
      badge.remove();
    }
  });
}

   (Backend wiring only, no styling/markup changes. Same
   apiRequest/apiGet pattern used for the approval workflow
   above. Every dataset below used to be a hardcoded mock array;
   each is now populated by loadPlatformData() from its own REST
   endpoint and the affected page is re-rendered once the data

// Shared convention for every module (this Super Admin dashboard, plus the
// upcoming student.html / trainer.html / college_admin.html): same base
// path, credentials:'include' so the session cookie carries over, and GET
// endpoints return either a bare array or { <key>: [...] }. New pages can
// call platformApiGet/platformApiPut against this same base without any
// changes here.
const PLATFORM_API = '/api';

async function platformApiGet(path){
  try {
    const res = await fetch(PLATFORM_API + path, { method:'GET', credentials:'include' });
    const data = await res.json();
    return { ok: res.ok, status: res.status, data };
  } catch (err) {
    return { ok:false, status:0, data:{ message:'Could not reach the server.' } };
  }
}

// Same shape as platformApiGet, for writes (profile updates, etc). Used by
// every module (Student/Trainer/College Admin/Super Admin) that needs to
// PUT/PATCH data back to the backend, so it lives here rather than being
// duplicated per page.
async function platformApiPut(path, body){
  try {
    const res = await fetch(PLATFORM_API + path, {
      method:'PUT', credentials:'include',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(()=>({}));
    return { ok: res.ok, status: res.status, data };
  } catch (err) {
    return { ok:false, status:0, data:{ message:'Could not reach the server.' } };
  }
}

// Same shape as platformApiGet/platformApiPut, for creates (e.g. publishing
// a new quiz from the Create Quiz wizard). Added alongside the others so
// the wizard has somewhere real to POST to.
async function platformApiPost(path, body){
  try {
    const res = await fetch(PLATFORM_API + path, {

      headers:{ 'Content-Type':'application/json' },

}

async function platformApiPatch(path, body){

      method:'PATCH', credentials:'include',

    });
    const data = await res.json().catch(()=>({}));

// Same shape as platformApiGet/platformApiPut, for deletes — used to

  try {

    const data = await res.json().catch(()=>({}));

/* ------------------------------------------------------------
   Individual dataset loaders. Each hits its own GET endpoint,
   expects a JSON body of the form { <key>: [...] } (or the raw
   array/object itself, whichever the backend returns), and — if
   the request fails or the shape is unexpected — silently keeps
   whatever was already loaded rather than throwing, so one bad
   endpoint never blocks the rest of the dashboard from loading.
------------------------------------------------------------ */
function pickArray(data, key){
  if(Array.isArray(data)) return data;
  if(data && Array.isArray(data[key])) return data[key];
  return null;
}
// Builds <option> markup for the Quiz Management / Quiz Responses "All
// Colleges" filters from MANAGED_COLLEGES — the real db.colleges-backed
// list (see loadManagedColleges()) — restricted to active colleges only.
// Updates automatically whenever a college is added/activated/deactivated,
// since MANAGED_COLLEGES is reloaded from the database on every refresh.
// Shows an explicit empty state instead of a silently blank dropdown.
function activeCollegeOptions(selected){
  const active = MANAGED_COLLEGES.filter(c => c.status === 'active');
  if(!active.length) return `<option value="" disabled>No colleges available</option>`;
  return active.map(c => `<option value="${esc(c.collegeName)}" ${selected===c.collegeName?'selected':''}>${esc(c.collegeName)}</option>`).join('');
}
async function loadColleges(){
  const res = await platformApiGet('/colleges');
  const arr = res.ok ? pickArray(res.data, 'colleges') : null;
  if(arr) COLLEGES = arr;
}

// The REAL college/department source of truth (db.colleges / db.departments),
// used by the "Add College" module on the College Management page and by
// the Create Quiz wizard's college dropdown (see getColleges()). Kept
// deliberately separate from COLLEGES/DEPARTMENTS above.
async function loadManagedColleges(){
  const res = await platformApiGet('/admin/colleges');
  const list = res.ok ? pickArray(res.data, 'colleges') : null;
  if(!list) return;
  MANAGED_COLLEGES = await Promise.all(list.map(async c => {
    const dres = await platformApiGet(`/admin/colleges/${c._id}/departments`);
    const depts = dres.ok ? (pickArray(dres.data, 'departments') || []) : [];
    return {
      id: c._id,
      collegeName: c.college_name,
      status: c.status,
      departments: depts.map(d => ({ id: d._id, departmentName: d.department_name, status: d.status })),
    };
  }));
  managedCollegesLoaded = true;
}

/* Maps a quiz_module.py document onto the flat {name,type,college,trainer,
   cohort,q,date,status} shape pageAssessmentsQuizzes() already renders —
   keeps the table markup completely untouched while the data underneath
   is now 100% backend-driven. canEdit/canDelete/raw are carried through
   for the real edit/delete/view actions below. */
function mapQuizFromApi(q){
  return {
    id: q.id,
    name: q.title || 'Untitled Quiz',
    type: q.category || '—',
    college: (q.collegeNames && q.collegeNames[0]) || (q.visibility==='all' ? 'All Colleges' : '—'),
    trainer: (q.createdBy && q.createdBy.name) || '—',
    cohort: cohortTargetLabel(q.cohortTarget),
    q: q.totalQuestions || 0,
    date: q.startDateTime ? new Date(q.startDateTime).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}) : '—',
    status: q.status === 'active' ? 'live' : q.status,
    canEdit: !!q.canEdit,
    canDelete: !!q.canDelete,
    canCancel: !!q.canCancel,
    canArchive: !!q.canArchive,
    rawStatus: q.status,
    createdOn: q.createdOn,
    _raw: q,
  };
}
// Table rows AND analytics/leaderboard both come straight from the

// The logged-in Super Admin's own profile — drives both the "My Profile"
// page and the profile chip in the top-right of the topbar. Same GET/PUT
// endpoint the Student/Trainer/College Admin modules will use for their
// own profile pages.
async function loadProfile(){
  const res = await platformApiGet('/auth/profile');
  if(res.ok && res.data){
    const p = res.data.profile || res.data.user || res.data;
    if(p && p.name){
      SUPER_ADMIN_PROFILE = { name:p.name, email:p.email||SUPER_ADMIN_PROFILE.email, phone:p.phone||SUPER_ADMIN_PROFILE.phone, role:p.role||SUPER_ADMIN_PROFILE.role };
    }
  }
  updateProfileChip();
}
// The logged-in Super Admin's own active sessions (this device plus any
// others) — drives the "Active sessions" row and expanded list on the
// Profile page. Replaces the old hardcoded "2 devices" text. If the
// endpoint isn't reachable yet, SESSIONS is left as-is (empty) rather
// than showing a fake number.
async function loadSessions(){
  const res = await platformApiGet('/auth/sessions');
  const arr = res.ok ? pickArray(res.data, 'sessions') : null;
  if(arr) SESSIONS = arr;
  if(STATE.page==='profile') renderPage();
}
// Placeholder endpoint until the Student/Trainer/College Admin session
// tracking is wired up server-side — see requirement to keep this
// backend-ready rather than hardcoded. Silently keeps 0s if unavailable.
async function loadLiveStats(){
  const res = await platformApiGet('/dashboard/live-stats');
  if(res.ok && res.data){
    const d = res.data;
    LIVE_STATS = {
      studentsOnline: d.studentsOnline ?? d.students_online ?? LIVE_STATS.studentsOnline,
      trainersOnline: d.trainersOnline ?? d.trainers_online ?? LIVE_STATS.trainersOnline,
      adminsOnline: d.adminsOnline ?? d.admins_online ?? LIVE_STATS.adminsOnline,
    };
  }
}

// Pulls every backend-driven dataset in parallel, rebuilds the derived
// USERS list once STUDENTS/TRAINERS/COLLEGES are in, then re-renders the
// current page so cards/graphs/tables never show stale hardcoded values.
// Called once at boot (see INIT below); pages that mutate data locally
// (e.g. publishing a quiz) keep doing so in-memory exactly as before.
async function loadPlatformData(){
  await Promise.all([
    loadColleges(), loadDepartments(), loadTrainers(), loadStudents(),
    loadQuestionBanks(), loadAssessmentTemplates(), loadInterventionsSummary(),
    loadQuizzes(), loadQuizResponses(), loadQuizAnalytics(), loadQuizResponsesFilterOptions(),
    loadQuizResultsAdmin(), loadQuizInterviewVerificationAdmin(), loadQuizValidationVerificationAdmin(),
    loadWorkshopSessions(), loadAttendanceRecords(), loadAuditLogs(),
    loadPlacementTrend(), loadDeptDistribution(), loadRecentActivity(),
    loadActionRequired(), loadAnnouncements(), loadUpcomingDrives(),
    loadKpis(), loadStudentDistribution(), loadProfile(), loadLiveStats(),
    loadSessions(), loadManagedColleges(),
  ]);
  buildUsersList();
  renderPage();
}
