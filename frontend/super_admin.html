function showBulkError(msg){ const el = document.getElementById('qzBulkError'); el.textContent = msg; el.style.display = ''; }

/* Every check (required columns, missing/invalid difficulty, empty
   options, invalid correct-answer references, non-positive marks,
   unknown sections) runs server-side in
   POST /api/trainer/quizzes/bulk-upload-validate (quiz_module.py) — this
   function only uploads the file and displays whatever the backend
   returns. No parsing or validation happens in the browser. */
async function validateBulkUpload(){
  if(!qzBulkFile){ showBulkError('Please choose a file first.'); return; }
  const btn = document.getElementById('qzValidateBtn');
  btn.disabled = true; btn.textContent = 'Validating…';
  document.getElementById('qzBulkError').style.display = 'none';

  const form = new FormData();
  form.append('file', qzBulkFile);
  let res;
  try{
    const raw = await fetch(PLATFORM_API + '/admin/quizzes/bulk-upload-validate', { method:'POST', credentials:'include', body: form });
    const data = await raw.json().catch(()=>({}));
    res = { ok: raw.ok, data };
  }catch(e){
    res = { ok:false, data:{ message:'Could not reach the server. Check your connection and try again.' } };
  }

  if(!res.ok){
    showBulkError(res.data.message || 'Could not validate this file.');
    qzBulkValidated = false;
    btn.disabled = false; btn.textContent = 'Validate Upload';
    updateFooterLabels();
    return;
  }

  qzBulkQuestions = res.data.questions || [];
  qzBulkErrors = res.data.errors || [];
  qzBulkSectionSummary = res.data.sectionSummary || {};
  qzBulkValidated = true;

  // Auto-populate every section's Available (Hard/Medium/Easy) fields from
  // what the backend actually found in the file — the admin only sets
  // Display counts from here (spec: "administrator only enters ... Questions
  // to Display / Hard / Medium / Easy Display").
  qzSections.forEach(s => {
    const summary = qzBulkSectionSummary[s.name] || { hard:0, medium:0, easy:0 };
    const cfg = qzSectionConfig[s.name] || (qzSectionConfig[s.name] = blankSectionConfig());
    cfg.hardAvailable = summary.hard || 0;
    cfg.mediumAvailable = summary.medium || 0;
    cfg.easyAvailable = summary.easy || 0;
  });
  renderSectionDistribution();
  renderImportedQuestionCounts();
  renderBulkValidationSummary(res.data.totalRows || (qzBulkQuestions.length + qzBulkErrors.length));

  btn.disabled = false; btn.textContent = 'Validate Upload';
  updateFooterLabels();
}
/* Total / Easy / Medium / Hard counts of the questions actually imported —
   shown immediately once validation returns, right under the upload
   control, before the admin even opens the Section Distribution grid. */
function renderImportedQuestionCounts(){
  const wrap = document.getElementById('qzBulkImportedWrap');
  if(!qzBulkQuestions.length){ wrap.style.display = 'none'; return; }
  const counts = { easy:0, medium:0, hard:0 };
  qzBulkQuestions.forEach(q => {
    const d = String(q.difficulty||'').toLowerCase();
    if(d==='easy') counts.easy++;
    else if(d==='medium') counts.medium++;
    else if(d==='hard') counts.hard++;
  });
  wrap.style.display = '';
  document.getElementById('qzBulkImportedStats').innerHTML = `
    <div class="val-stat"><strong>${qzBulkQuestions.length}</strong><span>Total Imported</span></div>
    <div class="val-stat v-valid"><strong>${counts.easy}</strong><span>Easy</span></div>
    <div class="val-stat"><strong>${counts.medium}</strong><span>Medium</span></div>
    <div class="val-stat v-invalid"><strong>${counts.hard}</strong><span>Hard</span></div>`;
}
function renderBulkValidationSummary(totalRows){
  const validCount = qzBulkQuestions.length;
  const invalidCount = qzBulkErrors.length;
  document.getElementById('qzBulkSummaryWrap').style.display = '';
  document.getElementById('qzBulkValSummary').innerHTML = `
    <div class="val-stat"><strong>${totalRows}</strong><span>Rows Read</span></div>
    <div class="val-stat v-valid"><strong>${validCount}</strong><span>Valid</span></div>
    <div class="val-stat v-invalid"><strong>${invalidCount}</strong><span>Invalid</span></div>`;
  const errWrap = document.getElementById('qzBulkErrorWrap');
  if(qzBulkErrors.length){
    errWrap.style.display = '';
    // Sheet name shown alongside Row (Part 1: bulk workbooks can now have
    // multiple sheets), sorted by sheet then row.
    document.getElementById('qzBulkErrorTbody').innerHTML = qzBulkErrors.slice()
      .sort((a,b)=> String(a.sheet||'').localeCompare(String(b.sheet||'')) || a.row-b.row)
      .map(e=>`<tr><td>${escAttr(e.sheet||'—')}</td><td>Row ${e.row}</td><td class="err-msg">${escAttr(e.issue)}</td></tr>`).join('');
    showBulkError('Fix the errors below, re-upload the corrected file, then validate again before continuing.');
  } else {
    errWrap.style.display = 'none';
    document.getElementById('qzBulkError').style.display = 'none';
    showToast(`${validCount} questions validated successfully`);
  }
}
function downloadValidationReport(){
  if(!qzBulkErrors.length){ showToast('No errors to report — validation passed.'); return; }
  const rows = ['Sheet,Row,Issue', ...qzBulkErrors.slice()
    .sort((a,b)=> String(a.sheet||'').localeCompare(String(b.sheet||'')) || a.row-b.row)
    .map(e=>`"${String(e.sheet||'').replace(/"/g,'""')}",${e.row},"${String(e.issue).replace(/"/g,'""')}"`)].join('\n');
  const blob = new Blob([rows], { type:'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'validation_report.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ---------------------------------------------------------------- Step 3: Review & Publish ---------------------------------------------------------------- */
function getPoolForReview(){ const t = getQuizType(); return t==='manual' ? qzQuestions : (t==='question_bank' ? [] : qzBulkQuestions); }
function renderReview(){
  const d = collectStep1();
  const pool = getPoolForReview();
  const isBank = getQuizType()==='question_bank';
  const { available, display } = sectionConfigTotals();
  const diffCounts = { Hard:0, Medium:0, Easy:0 };
  Object.values(qzSectionConfig).forEach(cfg => {
    diffCounts.Hard += cfg.hardDisplay; diffCounts.Medium += cfg.mediumDisplay; diffCounts.Easy += cfg.easyDisplay;
  });
  const sectionRows = qzSections.map(s => {
    const cfg = qzSectionConfig[s.name] || blankSectionConfig();
    return `<div class="review-item"><div class="ri-label">${escAttr(s.name)}</div><div class="ri-value">H ${cfg.hardDisplay} · M ${cfg.mediumDisplay} · E ${cfg.easyDisplay} (of ${cfg.hardAvailable+cfg.mediumAvailable+cfg.easyAvailable} avail.)</div></div>`;
  }).join('');

  document.getElementById('qzReview').innerHTML = `
    <div class="review-grid">
      <div class="review-item"><div class="ri-label">Assessment Name</div><div class="ri-value">${escAttr(d.name)}</div></div>
      <div class="review-item"><div class="ri-label">Applicable Cohort</div><div class="ri-value">${cohortTargetLabel(d.cohort)}</div></div>
      <div class="review-item"><div class="ri-label">Applicable Colleges</div><div class="ri-value">${d.collegeNames.length} selected</div></div>
      <div class="review-item"><div class="ri-label">Questions Available</div><div class="ri-value">${isBank ? `${available} in Question Bank` : `${pool.length} / ${available}`}</div></div>
      <div class="review-item"><div class="ri-label">Questions to Display</div><div class="ri-value">${display}</div></div>
      <div class="review-item"><div class="ri-label">Duration</div><div class="ri-value">${d.duration} min</div></div>
      <div class="review-item"><div class="ri-label">Start Date</div><div class="ri-value">${d.start ? new Date(d.start).toLocaleString() : '—'}</div></div>
      <div class="review-item"><div class="ri-label">End Date</div><div class="ri-value">${d.end ? new Date(d.end).toLocaleString() : '—'}</div></div>
    </div>
    <div class="section-title">Section Distribution</div>
    <div class="review-grid">${sectionRows || '<p style="color:var(--text-soft);font-size:13px;">No sections configured.</p>'}</div>
    <div class="section-title">Difficulty Distribution <span style="font-weight:500;text-transform:none;letter-spacing:0;">(to display)</span></div>
    <div class="review-grid">
      <div class="review-item"><div class="ri-label">Hard</div><div class="ri-value">${diffCounts.Hard}</div></div>
      <div class="review-item"><div class="ri-label">Medium</div><div class="ri-value">${diffCounts.Medium}</div></div>
      <div class="review-item"><div class="ri-label">Easy</div><div class="ri-value">${diffCounts.Easy}</div></div>
    </div>
    <p style="font-size:12px;color:var(--text-soft);margin-bottom:4px;">Colleges: ${d.collegeNames.join(', ') || '—'}</p>`;

  const letters = ['A','B','C','D'];
  document.getElementById('qzReviewQuestions').innerHTML = isBank
    ? '<p style="color:var(--text-soft);font-size:13px;">Question Bank mode: the actual question set is drawn fresh, at random, from the shared bank the moment you publish — so there is nothing to preview here yet.</p>'
    : (pool.slice(0,3).map((q,i) => `
    <div class="review-qcard">
      <div class="rq-num">Question ${i+1}${q.section?` · ${escAttr(q.section)}`:''}${q.difficulty?` · ${escAttr(q.difficulty)}`:''} · ${q.type==='single_choice'?'Single Choice':'Multiple Choice'}</div>
      <div>${escAttr(q.text)}</div>
      <ul>${(q.options||[]).map((o,oi)=> o ? `<li class="${(q.correct||[]).includes(oi)?'correct':''}">${letters[oi]}. ${escAttr(o)}</li>` : '').join('')}</ul>
    </div>`).join('') || '<p style="color:var(--text-soft);font-size:13px;">No questions to preview yet.</p>');

/* sectionConfig is sent verbatim to quiz_module.validate_section_config() —
   the backend re-derives Questions Available/Displayed and the flat
   section/difficulty distributions from it, and re-validates every number
   against the actual question pool. Nothing here is trusted as final. */
function buildAssessmentPayload(d, pool, status){
  const sectionConfig = {};
  qzSections.forEach(s => {
    const cfg = qzSectionConfig[s.name] || blankSectionConfig();
    sectionConfig[s.name] = {
      hardAvailable: cfg.hardAvailable, mediumAvailable: cfg.mediumAvailable, easyAvailable: cfg.easyAvailable,
      hardDisplay: cfg.hardDisplay, mediumDisplay: cfg.mediumDisplay, easyDisplay: cfg.easyDisplay,
      questionsAvailable: cfg.hardAvailable + cfg.mediumAvailable + cfg.easyAvailable,
      questionsToDisplay: cfg.hardDisplay + cfg.mediumDisplay + cfg.easyDisplay,
    };
  });
  return {
    assessment_name: d.name,
    assessment_type: d.quizType,
    applicable_colleges: d.colleges,
    applicable_cohort: d.cohort,
    start_datetime: d.start,
    end_datetime: d.end,
    duration: d.duration,
    status,
    sectionConfig,
    question_pool: pool.map(q => ({
      text: q.text, options: q.options, correct: q.correct,
      type: q.type || 'single_choice',
      section: q.section || null,
      difficulty: q.difficulty, marks: q.marks, explanation: q.explanation || '',
    })),
  };
}
function buildDraftPayload(){
  const d = collectStep1();
  const payload = buildAssessmentPayload(d, getPoolForReview(), 'draft');
  if(qzEditingId) payload.id = qzEditingId;
  else if(qzDraftId) payload.id = qzDraftId;
  return payload;
}
async function saveQuizDraft(){
  const btn = document.getElementById('qzSaveDraftBtn');
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = 'Saving…';
  if(qzCurrentStep===2 && getQuizType()==='manual') autosaveCurrentQuestion(true);
  const res = await platformApiPut('/admin/quizzes/draft', buildDraftPayload());
  if(res.ok && res.data.id && !qzEditingId) qzDraftId = res.data.id;
  btn.disabled = false; btn.textContent = original;
  showToast(res.ok ? 'Draft saved' : 'Draft saved locally — will sync once the server is reachable', !res.ok);
  if(res.ok){ await loadQuizzes(); renderPage(); }
}
async function publishQuiz(){
  const errEl = document.getElementById('qzStep3Error');
  // PART 3: never silently fail — when the backend returns a full
  // `errors` array, show every problem at once instead of just the
  // first/truncated one.
  const fail = (msg, errorsList)=>{
    if(Array.isArray(errorsList) && errorsList.length>1){
      errEl.innerHTML = `<strong>${escAttr(msg||'Please fix the following before publishing:')}</strong><ul style="margin:6px 0 0 18px;padding:0;">${errorsList.map(e=>`<li>${escAttr(e)}</li>`).join('')}</ul>`;
    } else {
      errEl.textContent = msg;
    }
    errEl.style.display='';
  };
  const d = collectStep1();
  const pool = getPoolForReview();
  const { available, display } = sectionConfigTotals();

  if(!validateSectionDistribution()) return fail('Fix the Section Distribution grid — Available/Display must add up per section.');
  if(d.quizType==='manual'){
    if(pool.length !== available) return fail(`Question count (${pool.length}) does not match total Questions Available (${available}).`);
    if(pool.some(q=>!isQuestionComplete(q))) return fail('Complete every manual question before publishing.');
  } else if(d.quizType==='bulk'){
    if(!qzBulkValidated || qzBulkErrors.length>0) return fail('Resolve the Excel validation errors before publishing.');
    if(pool.length !== available) return fail(`Uploaded question count (${pool.length}) does not match total Questions Available (${available}) — re-check your Section Distribution.`);
  }
  // Question Bank mode: nothing to check client-side — Available is
  // always the live bank count and the actual question set is drawn
  // server-side at the moment of publish (Part 7/8).
  errEl.style.display = 'none';

  const btn = document.getElementById('qzNextBtn');
  btn.disabled = true; btn.textContent = 'Publishing…';
  const payload = buildAssessmentPayload(d, pool, 'published');
  if(qzEditingId){ payload.id = qzEditingId; }
  const res = qzEditingId
    ? await platformApiPut(`/admin/quizzes/${qzEditingId}`, payload)
    : await platformApiPost('/admin/quizzes', payload);
  btn.disabled = false; btn.textContent = 'Publish Quiz';

  if(!res.ok){ return fail(res.data.message || 'Could not publish this quiz. Save it as a draft and try again.', res.data.errors); }
  closeQuizModal();
  showToast(`${d.name} ${qzEditingId ? 'updated' : 'published'}`);
  resetWizard();
  await loadQuizzes(); renderPage();
}

/* ---------------------------------------------------------------- Wizard shell: stepper, nav, reset ---------------------------------------------------------------- */
function updateFooterLabels(){
  const nextBtn = document.getElementById('qzNextBtn');
  document.getElementById('qzSaveDraftBtn').style.display = qzCurrentStep===1 ? 'none' : '';
  if(qzCurrentStep===1){ nextBtn.textContent = 'Next →'; nextBtn.disabled = false; nextBtn.title = ''; }
  else if(qzCurrentStep===2){
    // PART 2 FIX: single, unambiguous label — this button only ever
    // means "finish this step and continue to Review". Moving between
    // individual questions is the top Prev Q/Next Q bar's job alone —
    // there is no longer a second, conflicting navigation system here.
    const { available, display } = sectionConfigTotals();
    const sectionsOk = qzSections.length>0 && available>0 && display>0 && display<=available;
    nextBtn.disabled = !sectionsOk;
    // PART 3: never disable without explanation — always say exactly why.
    nextBtn.title = sectionsOk ? '' : (
      qzSections.length===0 ? 'Add assessment sections before continuing.'
      : available===0 ? 'Configure at least one section with Available questions.'
      : display===0 ? 'Set how many questions to Display for at least one section.'
      : 'Total to Display cannot exceed Total Available.'
    );
    nextBtn.textContent = 'Continue to Review →';
  } else { nextBtn.textContent = 'Publish Quiz'; nextBtn.disabled = false; nextBtn.title = ''; }
}
function updateStepperUI(){
  document.querySelectorAll('#quizModal .step').forEach(s=>{
    const n = parseInt(s.dataset.step);
    s.classList.toggle('active', n===qzCurrentStep);
    s.classList.toggle('done', n<qzCurrentStep);
  });
  document.querySelectorAll('#quizModal .qz-step').forEach((el,i)=> el.style.display = (i+1===qzCurrentStep) ? 'block' : 'none');
  document.getElementById('qzPrevBtn').style.visibility = qzCurrentStep===1 ? 'hidden' : 'visible';
  updateFooterLabels();
}
async function renderStep2View(){
  await renderSectionDistributionPanel();
  const type = getQuizType();
  document.getElementById('qzManualWrap').style.display = type==='manual' ? '' : 'none';
  document.getElementById('qzBulkWrap').style.display = type==='bulk' ? '' : 'none';
  if(type==='manual'){
    buildManualQueueFromSectionConfig();
    renderCurrentQuestion();
  }
  updateFooterLabels();
}
async function enterStep2(){ qzCurrentStep = 2; updateStepperUI(); await renderStep2View(); }
function enterStep3(){ qzCurrentStep = 3; updateStepperUI(); renderReview(); }

async function qzNext(){
  if(qzCurrentStep===1){
    if(!validateStep1()) return;
    await enterStep2();
    return;
  }
  if(qzCurrentStep===2){
    if(!validateSectionDistribution()) return;
    if(getQuizType()==='manual'){
      // PART 2 FIX: no longer steps through individual questions (that
      // was a second, conflicting navigation system — the top
      // "← Prev Q / Next Q →" bar already owns that job, see
      // goToQuestion()). This button's only job on Step 2 is "finish
      // authoring and continue to Review", evaluated across the whole
      // pool, not just whichever question happens to be on screen.
      autosaveCurrentQuestion(true);
      const incomplete = qzQuestions.filter(q=>!isQuestionComplete(q)).length;
      const errEl = document.getElementById('qzManualError');
      if(incomplete>0){
        const firstIncomplete = qzQuestions.findIndex(q=>!isQuestionComplete(q));
        if(firstIncomplete>=0 && firstIncomplete!==qzCurrentQIndex){ qzCurrentQIndex = firstIncomplete; renderCurrentQuestion(); }
        errEl.textContent = `${incomplete} question${incomplete===1?'':'s'} still need to be completed before continuing. Jumped to the first one.`;
        errEl.style.display='';
        return;
      }
      errEl.style.display = 'none';
      enterStep3();
      return;
    }
    if(getQuizType()==='question_bank'){
      // Question Bank mode has no authored pool to check here — Available
      // is always sourced live from the bank (see renderSectionDistributionPanel),
      // so validateSectionDistribution() above already covers everything
      // this step needs to gate on.
      enterStep3();
      return;
    }
    const errEl = document.getElementById('qzBulkError');
    if(!qzBulkValidated || qzBulkErrors.length>0 || !qzBulkQuestions.length){
      errEl.textContent = 'Upload and successfully validate your Excel file before continuing.'; errEl.style.display=''; return;
    }
    const { available } = sectionConfigTotals();
    if(qzBulkQuestions.length !== available){
      errEl.textContent = `Uploaded ${qzBulkQuestions.length} valid questions, but Section Distribution totals ${available} Available. Adjust the Display counts or re-upload.`; errEl.style.display=''; return;
    }
    errEl.style.display = 'none';
    enterStep3();
    return;
  }
  if(qzCurrentStep===3){ await publishQuiz(); }
}
async function qzPrev(){
  if(qzCurrentStep===3){ qzCurrentStep=2; updateStepperUI(); await renderStep2View(); return; }
  if(qzCurrentStep===2){
    // PART 2 FIX: "← Previous" always leaves Step 2 back to Step 1 now —
    // moving between individual questions is exclusively the top
    // "← Prev Q" button's job (goToQuestion()).
    qzCurrentStep = 1; updateStepperUI(); return;
  }
}
function resetWizard(){
  qzCurrentStep = 1;
  qzEditingId = null; qzDraftId = null;
  document.getElementById('quizModal').querySelector('.qzw-modal-head h3').textContent = 'Create Quiz';
  document.getElementById('qzNextBtn').style.visibility = '';
  qzQuestions = []; qzCurrentQIndex = 0;
  qzSections = []; qzSectionConfig = {};
  qzBulkFile = null; qzBulkQuestions = []; qzBulkErrors = []; qzBulkSectionSummary = {}; qzBulkValidated = false;
  qzBankAvailability = {};
  qzCollegesSelected = new Set();
  ['qzStep1Error','qzManualError','qzBulkError','qzStep3Error','qzSectionDistError'].forEach(id=>{ const el=document.getElementById(id); if(el) el.style.display='none'; });
  ['qzName','qzStart','qzEnd','qzDuration'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  document.getElementById('qzCohort').value = 'all';
  document.querySelectorAll('input[name="qzType"]').forEach(r => r.checked = r.value==='manual');
  onQuizTypeChange('manual');
  const selAll = document.getElementById('qzCollegeSelectAll'); if(selAll) selAll.checked = false;
  clearBulkFile();
  updateCollegesTriggerUI();
  updateStepperUI();
}
async function openQuizModal(){
  document.getElementById('modal-root').innerHTML = quizWizardMarkup();
  resetWizard();
  qzColleges = await getColleges();
  renderCollegeOptions('');
  updateCollegesTriggerUI();
}
function closeQuizModal(){
  document.getElementById('modal-root').innerHTML = '';
}

/* Opens the same wizard pre-filled with an existing quiz's data. Fetches
   the full quiz (including its question pool) fresh from the backend so
   the edit form is never based on stale/partial list data. Server-side
   editing restrictions (already-started / completed) are re-checked on
   submit regardless, but we also surface the message immediately here. */
async function editQuiz(id){
  const res = await platformApiGet(`/admin/quizzes/${id}`);
  if(!res.ok){ showToast(res.data.message || 'Could not load this quiz.', true); return; }
  const q = res.data.quiz;
  if(!q.canEdit){
    showToast(q.status === 'completed'
      ? 'This quiz has been completed and is now read-only.'
      : 'This quiz has already started and can no longer be edited.', true);
    return;
  }
  document.getElementById('modal-root').innerHTML = quizWizardMarkup();
  resetWizard();
  qzEditingId = id;
  document.getElementById('quizModal').querySelector('.qzw-modal-head h3').textContent = 'Edit Quiz';

  qzColleges = await getColleges();
  qzCollegesSelected = new Set(q.colleges || []);
  renderCollegeOptions('');
  updateCollegesTriggerUI();

  document.getElementById('qzName').value = q.title || '';
  document.getElementById('qzCohort').value = q.cohortTarget || 'all';
  document.getElementById('qzStart').value = isoToLocalInput(q.startDateTime);
  document.getElementById('qzEnd').value = isoToLocalInput(q.endDateTime);
  document.getElementById('qzDuration').value = q.durationMinutes || '';

  const type = (q.quizType === 'bulk' || q.quizType === 'question_bank') ? q.quizType : 'manual';
  document.querySelectorAll('input[name="qzType"]').forEach(r => r.checked = r.value===type);

  await ensureSectionsLoaded();
  // Pre-fill sectionConfig from the stored quiz — either the granular
  // grid (new quizzes) or, for quizzes created before this redesign, a
  // best-effort reconstruction from the flat sectionDistribution/
  // difficultyDistribution/question pool so editing an old quiz doesn't
  // start from a blank grid.
  if(q.sectionConfig && Object.keys(q.sectionConfig).length){
    qzSections.forEach(s => { qzSectionConfig[s.name] = Object.assign(blankSectionConfig(), q.sectionConfig[s.name] || {}); });
  } else {
    const byKey = {};
    (q.questions || []).forEach(qq => {
      const key = `${qq.section}|${(qq.difficulty||'').toLowerCase()}`;
      byKey[key] = (byKey[key]||0) + 1;
    });
    const sectionDist = q.sectionDistribution || {};
    qzSections.forEach(s => {
      const cfg = blankSectionConfig();
      cfg.hardAvailable = byKey[`${s.name}|hard`] || 0;
      cfg.mediumAvailable = byKey[`${s.name}|medium`] || 0;
      cfg.easyAvailable = byKey[`${s.name}|easy`] || 0;
      const displayTotal = sectionDist[s.name] || 0;
      // Best-effort even split of the legacy flat per-section Display total across difficulties.
      cfg.hardDisplay = Math.min(cfg.hardAvailable, displayTotal);
      qzSectionConfig[s.name] = cfg;
    });
  }
  onQuizTypeChange(type);

  qzQuestions = (q.questions || []).map(qq => ({
    text: qq.text || '', options: (qq.options && qq.options.length ? qq.options.slice(0,4) : ['','','','']),
    correct: qq.correct || [], type: qq.type || 'single_choice',
    difficulty: qq.difficulty || '', marks: qq.marks != null ? qq.marks : '',
    explanation: qq.explanation || '', section: qq.section || '',
  }));
}

/* Read-only view of a quiz — every question, its options, the correct
   answer(s), difficulty, marks, section and explanation. No editing
   controls of any kind. */
async function viewQuiz(id){
  const res = await platformApiGet(`/admin/quizzes/${id}`);
  if(!res.ok){ showToast(res.data.message || 'Could not load this quiz.', true); return; }
  const q = res.data.quiz;
  const letters = ['A','B','C','D'];
  const body = `
    <div class="review-grid" style="margin-bottom:18px;">
      <div class="review-item"><div class="ri-label">Quiz Title</div><div class="ri-value">${esc(q.title||'')}</div></div>
      <div class="review-item"><div class="ri-label">Category</div><div class="ri-value">${esc(q.category||'—')}</div></div>
      <div class="review-item"><div class="ri-label">Status</div><div class="ri-value">${statusChip(q.status==='scheduled'||q.status==='active'?'published':q.status)}</div></div>
      <div class="review-item"><div class="ri-label">Questions Available</div><div class="ri-value">${q.questionsAvailable||0}</div></div>
      <div class="review-item"><div class="ri-label">Questions Displayed</div><div class="ri-value">${q.questionsDisplayed||0}</div></div>
      <div class="review-item"><div class="ri-label">Duration</div><div class="ri-value">${q.durationMinutes||0} min</div></div>
      <div class="review-item"><div class="ri-label">Start</div><div class="ri-value">${q.startDateTime ? new Date(q.startDateTime).toLocaleString() : '—'}</div></div>
      <div class="review-item"><div class="ri-label">End</div><div class="ri-value">${q.endDateTime ? new Date(q.endDateTime).toLocaleString() : '—'}</div></div>
    </div>
    ${q.description ? `<p style="margin-bottom:16px;color:var(--text-soft);">${esc(q.description)}</p>` : ''}
    <div class="section-title">Questions (${(q.questions||[]).length})</div>
    ${(q.questions||[]).map((qq,i)=>`
      <div class="panel" style="margin-bottom:12px;padding:14px;">
        <div class="rq-num">Question ${i+1}${qq.section?` · ${esc(qq.section)}`:''} · ${esc(qq.difficulty||'—')} · ${qq.marks||0} marks</div>
        <div style="margin:6px 0 10px;">${esc(qq.text||'')}</div>
        ${letters.map((L,li)=>`<div style="padding:4px 0;${ (qq.correct||[]).includes(li) ? 'color:var(--teal-dark);font-weight:600;' : ''}">${L}. ${esc(qq.options && qq.options[li] || '')}${(qq.correct||[]).includes(li)?' ✓':''}</div>`).join('')}
        ${qq.explanation ? `<div style="margin-top:8px;font-size:12.5px;color:var(--text-soft);">Explanation: ${esc(qq.explanation)}</div>` : ''}
      </div>`).join('') || '<p style="color:var(--text-soft);">No questions.</p>'}
  `;
  openBigModal(esc(q.title||'Quiz'), body, `<button class="btn btn-ghost" data-action="close-big-modal">Close</button>`, true);
}

/* Publish/unpublish toggle — server re-checks the time-based restriction
   regardless of what the table currently shows. */
async function toggleQuizStatus(id, currentStatus){
  const nextStatus = (currentStatus === 'scheduled' || currentStatus === 'active') ? 'draft' : 'published';
  const res = await platformApiPatch(`/admin/quizzes/${id}/status`, { status: nextStatus });
  if(!res.ok){ showToast(res.data.message || 'Could not update quiz status.', true); return; }
  showToast(nextStatus === 'published' ? 'Quiz published' : 'Quiz unpublished');
  await loadQuizzes();
  renderPage();
}
document.addEventListener('click', function(e){
  if(e.target && e.target.id==='quizModal') closeQuizModal();
});
document.addEventListener('click', function(e){
  if(e.target && e.target.id==='qzStatsModal') closeQuizStatsModal();
});
